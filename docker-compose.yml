# Kendi sunucunuzda (VPS) otomatik HTTPS ile çalıştırma:
#   1) Alan adınızın (ör. musteri.firmaniz.com) DNS A kaydını sunucu IP'sine yönlendirin
#   2) .env dosyasına:  ALAN_ADI=musteri.firmaniz.com   PANEL_PASSWORD=GucluBirSifre
#   3) docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - APP_PUBLIC=1
      - PANEL_PASSWORD=${PANEL_PASSWORD}
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${ALAN_ADI} --to app:8000
    volumes:
      - caddy_data:/data
volumes:
  caddy_data:
