<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:X;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf)}
@font-face{font-family:B;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(clean.png) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.72) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 62%,rgba(0,0,0,.78) 100%)}
.top{position:absolute;top:170px;width:100%;text-align:center;font-family:X;color:#fff;font-size:118px;line-height:1.02;letter-spacing:-1px;text-shadow:0 6px 18px rgba(0,0,0,.7)}
.top span{color:#ff8a1f}
.tag{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);background:#ff8a1f;color:#1a0d00;font-family:B;font-size:58px;padding:18px 44px;border-radius:60px;white-space:nowrap}
.ring{position:absolute;left:300px;top:1010px;width:200px;height:200px;border:12px solid #ff8a1f;border-radius:50%;box-shadow:0 0 30px rgba(255,138,31,.8)}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="top">OLDER THAN<br>THE <span>PYRAMIDS</span>?!</div>
<div class="ring"></div>
<div class="tag">11,600 YEARS OLD 😳</div>
</body></html>
