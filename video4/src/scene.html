<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Frame-accurate 2D animation for "$5 a Day \u2192 $206,742".
// render(t) draws the frame at time t (seconds); window.T holds timings.json.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  navy: '#0B1530', navy2: '#13224A', gold: '#F5B700', gold2: '#FFD95A', red: '#FF3B3B',
  blue: '#3BA7FF', green: '#2FBF71', pink: '#FF8FB1', pinkD: '#D9547F', white: '#FFFFFF', ink: '#0A0F1F',
};
const FONT = 'Inter, "Noto Color Emoji", sans-serif';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const pop = (t, s, d = .35) => { const k = prog(t, s, d); return k <= 0 ? 0 : easeBack(k); };
function rnd(seed) { let x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function withT(x, y, s, rot, fn) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s); fn(); ctx.restore();
}
function text(str, x, y, size, color, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = opts.align || 'center'; ctx.textBaseline = 'middle';
  if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.glowBlur || 30; }
  if (opts.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = opts.strokeW || size * .16; ctx.strokeStyle = opts.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function glowCircle(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}

// ---------- drawables (all centered at 0,0) ----------
function drawCard(w = 520) {
  const h = w * .63, r = w * .06;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, '#FFE58A'); g.addColorStop(.45, '#F5B700'); g.addColorStop(1, '#B07A00');
  rr(-w / 2, -h / 2, w, h, r); ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent';
  // sheen
  ctx.save(); rr(-w / 2, -h / 2, w, h, r); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.moveTo(-w * .2, -h); ctx.lineTo(w * .05, -h); ctx.lineTo(-w * .25, h); ctx.lineTo(-w * .5, h); ctx.fill();
  ctx.restore();
  // chip
  rr(-w * .38, -h * .18, w * .17, h * .26, 8); ctx.fillStyle = '#E8D9A8'; ctx.fill();
  ctx.strokeStyle = '#9C7F2E'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w * .38, -h * .05); ctx.lineTo(-w * .21, -h * .05); ctx.moveTo(-w * .295, -h * .18); ctx.lineTo(-w * .295, h * .08); ctx.stroke();
  // contactless
  ctx.strokeStyle = '#7A5500'; ctx.lineWidth = w * .012; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-w * .1, -h * .05, w * (.03 + i * .028), -.8, .8); ctx.stroke(); }
  // number + label
  text('5281  ••••  ••••  2026', -w * .4, h * .26, w * .06, '#5A3F00', { align: 'left', weight: 800 });
  text('GOLD', w * .38, -h * .32, w * .055, '#5A3F00', { align: 'right', weight: 900 });
  ctx.restore();
}

function drawBill(w = 300) {
  const h = w * .46;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
  rr(-w / 2, -h / 2, w, h, 10); ctx.fillStyle = '#3FB86B'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(-w / 2 + 10, -h / 2 + 10, w - 20, h - 20, 6); ctx.strokeStyle = '#1E7A43'; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, h * .32, h * .32, 0, 0, 7); ctx.fillStyle = '#2E9A57'; ctx.fill();
  text('$', 0, 2, h * .48, '#D8FFE6');
  text('100', -w * .36, -h * .26, h * .16, '#D8FFE6', { weight: 800 });
  text('100', w * .36, h * .26, h * .16, '#D8FFE6', { weight: 800 });
  ctx.restore();
}

function drawCoin(r = 40) {
  ctx.save();
  const g = ctx.createRadialGradient(-r * .3, -r * .3, 2, 0, 0, r);
  g.addColorStop(0, '#FFF1A8'); g.addColorStop(.6, '#F5B700'); g.addColorStop(1, '#A87200');
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = r * .1; ctx.strokeStyle = '#C48A00'; ctx.stroke();
  text('$', 0, r * .05, r * 1.1, '#9A6500');
  ctx.restore();
}

// mood: neutral | pain | dreamy | happy | wink | sleepy
function drawBrain(r, mood, t, opts = {}) {
  ctx.save();
  const aura = { pain: C.red, dreamy: C.blue, happy: C.gold, wink: C.gold }[mood];
  if (aura) glowCircle(0, 0, r * 2.1, aura, .55 + .15 * Math.sin(t * 6));
  if (mood === 'pain') ctx.translate(Math.sin(t * 60) * r * .03, Math.cos(t * 47) * r * .02);
  // legs + arms
  ctx.strokeStyle = '#2A1630'; ctx.lineWidth = r * .09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .3, r * .75); ctx.lineTo(-r * .35, r * 1.15); ctx.moveTo(r * .3, r * .75); ctx.lineTo(r * .35, r * 1.15); ctx.stroke();
  if (opts.arms !== false) {
    const wave = opts.wave ? Math.sin(t * 9) * .4 : 0;
    ctx.beginPath(); ctx.moveTo(-r * .85, r * .15); ctx.quadraticCurveTo(-r * 1.2, r * .3, -r * 1.25, r * (mood === 'pain' ? -.35 : .55));
    ctx.moveTo(r * .85, r * .15); ctx.quadraticCurveTo(r * 1.2, r * (.1 - wave), r * 1.3, r * (opts.raise ? -.55 - wave : .5)); ctx.stroke();
  }
  // body lobes
  const lobes = [[-.45, -.35, .5], [.05, -.5, .52], [.5, -.3, .48], [-.6, .1, .45], [.62, .12, .45], [-.3, .35, .48], [.3, .38, .48], [0, 0, .6]];
  ctx.fillStyle = C.pinkD;
  for (const [x, y, s] of lobes) { ctx.beginPath(); ctx.arc(x * r, y * r, s * r + r * .05, 0, 7); ctx.fill(); }
  const bg = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r * 1.1);
  bg.addColorStop(0, '#FFC2D4'); bg.addColorStop(1, C.pink);
  ctx.fillStyle = bg;
  for (const [x, y, s] of lobes) { ctx.beginPath(); ctx.arc(x * r, y * r, s * r, 0, 7); ctx.fill(); }
  // folds
  ctx.strokeStyle = 'rgba(190,60,110,.55)'; ctx.lineWidth = r * .045;
  ctx.beginPath(); ctx.moveTo(0, -r * .95); ctx.bezierCurveTo(-r * .1, -r * .6, r * .1, -r * .5, 0, -r * .3); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * .55, -r * .45, r * .2, 3.6, 5.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * .55, -r * .45, r * .2, 3.8, 5.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * .75, r * .2, r * .16, 4.5, 6.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * .75, r * .2, r * .16, 2.8, 4.9); ctx.stroke();
  // face
  const ey = r * .02, ex = r * .26;
  ctx.strokeStyle = '#2A1630'; ctx.fillStyle = '#2A1630'; ctx.lineWidth = r * .06;
  const blink = (mood === 'neutral' || mood === 'happy') && (t % 3.1) < .12;
  if (mood === 'pain') {
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * ex - r * .1, ey - r * .09); ctx.lineTo(s * ex + s * r * .06 * -1 + (s > 0 ? r * .06 : -r * .06) * 0, ey); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * ex - s * r * .1, ey - r * .1); ctx.lineTo(s * ex + s * r * .08, ey); ctx.lineTo(s * ex - s * r * .1, ey + r * .1); ctx.stroke();
    }
    rr(-r * .22, r * .22, r * .44, r * .2, r * .05); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); for (let i = 1; i < 4; i++) { ctx.moveTo(-r * .22 + i * r * .11, r * .22); ctx.lineTo(-r * .22 + i * r * .11, r * .42); } ctx.moveTo(-r * .22, r * .32); ctx.lineTo(r * .22, r * .32); ctx.lineWidth = r * .025; ctx.stroke();
  } else if (mood === 'dreamy' || mood === 'sleepy') {
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * ex, ey, r * .09, Math.PI * 1.1, Math.PI * 1.9, mood === 'dreamy'); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, r * .22, r * .16, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,90,140,.45)';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * .45, r * .2, r * .1, r * .06, 0, 0, 7); ctx.fill(); }
  } else {
    for (const s of [-1, 1]) {
      if (blink || (mood === 'wink' && s > 0)) { ctx.beginPath(); ctx.arc(s * ex, ey, r * .09, .3, Math.PI - .3); ctx.stroke(); continue; }
      ctx.beginPath(); ctx.ellipse(s * ex, ey, r * .11, r * .14, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(s * ex + r * .02, ey + r * .02, r * .06, 0, 7); ctx.fillStyle = '#2A1630'; ctx.fill();
      ctx.beginPath(); ctx.arc(s * ex + r * .04, ey - r * .02, r * .02, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    }
    ctx.beginPath();
    if (mood === 'neutral') ctx.arc(0, r * .2, r * .12, .4, Math.PI - .4); else ctx.arc(0, r * .18, r * .2, .15, Math.PI - .15);
    ctx.stroke();
  }
  ctx.restore();
  if (mood === 'pain') {
    for (let i = 0; i < 5; i++) {
      const a = -2.6 + i * .55 + Math.sin(t * 8 + i) * .05, d = r * (1.35 + .12 * Math.sin(t * 14 + i * 2));
      withT(Math.cos(a) * d, Math.sin(a) * d, r / 160, a + Math.PI / 2, () => drawBolt());
    }
  }
  if (mood === 'dreamy') {
    for (let i = 0; i < 3; i++) {
      const k = ((t * .5 + i / 3) % 1);
      ctx.save(); ctx.globalAlpha = 1 - k;
      withT(r * (.7 + i * .25), -r * (1 + k * 1.2), r / 160 * (.6 + k * .4), 0, () => drawHeart());
      ctx.restore();
    }
  }
}
function drawBolt() {
  ctx.beginPath(); ctx.moveTo(-10, -45); ctx.lineTo(18, -45); ctx.lineTo(4, -8); ctx.lineTo(22, -8); ctx.lineTo(-14, 48); ctx.lineTo(-4, 6); ctx.lineTo(-22, 6); ctx.closePath();
  ctx.fillStyle = C.red; ctx.shadowColor = C.red; ctx.shadowBlur = 20; ctx.fill();
}
function drawHeart() {
  ctx.beginPath(); ctx.moveTo(0, 18); ctx.bezierCurveTo(-40, -10, -20, -40, 0, -18); ctx.bezierCurveTo(20, -40, 40, -10, 0, 18);
  ctx.fillStyle = '#7FC8FF'; ctx.shadowColor = C.blue; ctx.shadowBlur = 20; ctx.fill();
}
function drawPerson(color, item, t, seed) {
  const b = Math.sin(t * 4 + seed) * 4;
  ctx.save(); ctx.translate(0, b);
  rr(-55, 0, 110, 150, 50); ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -40, 42, 0, 7); ctx.fillStyle = '#F2C6A0'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -52, 44, Math.PI, 0); ctx.fillStyle = '#3A2A20'; ctx.fill();
  ctx.fillStyle = '#2A1630'; ctx.beginPath(); ctx.arc(-14, -38, 5, 0, 7); ctx.arc(14, -38, 5, 0, 7); ctx.fill();
  withT(60, 40, .38, -.3 + Math.sin(t * 5 + seed) * .08, () => item === 'cash' ? drawBill(300) : drawCard(300));
  ctx.restore();
}
function drawTerminal() {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30;
  rr(-130, -200, 260, 400, 40); ctx.fillStyle = '#1C2333'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(-100, -170, 200, 130, 16); ctx.fillStyle = '#0E3A5C'; ctx.fill();
  text('))))', 0, -105, 50, '#7FD3FF', { weight: 900 });
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { rr(-90 + j * 66, -10 + i * 50, 48, 36, 8); ctx.fillStyle = '#39445C'; ctx.fill(); }
  const cols = ['#E74C3C', '#F1C40F', '#2ECC71'];
  for (let j = 0; j < 3; j++) { rr(-90 + j * 66, 140, 48, 30, 8); ctx.fillStyle = cols[j]; ctx.fill(); }
  ctx.restore();
}
function drawPhone(t, s0) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40;
  rr(-210, -400, 420, 800, 60); ctx.fillStyle = '#111827'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(-190, -380, 380, 760, 44); ctx.fillStyle = '#F4F6FB'; ctx.fill();
  rr(-60, -365, 120, 26, 13); ctx.fillStyle = '#111827'; ctx.fill();
  text('Checkout', 0, -290, 40, '#111827', { weight: 800 });
  withT(0, -120, .62, 0, () => drawCard(520));
  const k = pop(t, s0 + .5, .4);
  withT(0, 90, k, 0, () => {
    rr(-160, -40, 320, 80, 40); ctx.fillStyle = '#E5F8EE'; ctx.fill();
    text('✓ Card saved', 0, 2, 38, '#1E9E5A', { weight: 800 });
  });
  const k2 = pop(t, s0 + 1.0, .4);
  withT(0, 250, k2 * (1 + .04 * Math.sin(t * 8)), 0, () => {
    rr(-160, -55, 320, 110, 55); ctx.fillStyle = '#111827'; ctx.fill();
    text('Pay in 1 tap', 0, 2, 40, '#fff', { weight: 800 });
  });
  ctx.restore();
}
function drawChip(color) {
  ctx.beginPath(); ctx.arc(0, 0, 60, 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.setLineDash([22, 16]); ctx.lineWidth = 14; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 52, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.lineWidth = 4; ctx.stroke();
  text('$', 0, 3, 40, '#fff');
}
function drawCalendar(n, t, s0) {
  rr(-380, -230, 760, 460, 36); ctx.fillStyle = '#F4F6FB'; ctx.fill();
  rr(-380, -230, 760, 110, 36); ctx.fillStyle = C.red; ctx.fill(); ctx.fillRect(-380, -160, 760, 40);
  text('7-DAY CASH CHALLENGE', 0, -172, 44, '#fff', { weight: 900 });
  const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  for (let i = 0; i < 7; i++) {
    const x = -315 + i * 105, y = 40;
    rr(x - 44, y - 70, 88, 160, 18); ctx.fillStyle = '#E3E8F3'; ctx.fill();
    text(days[i], x, y - 30, 40, '#4A5470', { weight: 800 });
    const k = pop(t, s0 + i * .32, .3);
    if (k > 0) withT(x, y + 40, k, 0, () => { text('✓', 0, 0, 70, C.green, { weight: 900 }); });
  }
}
function drawBuilding() {
  // neoclassical facade with a dome
  ctx.fillStyle = '#C9CFDB';
  ctx.beginPath(); ctx.arc(0, -250, 170, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#AEB6C6'; ctx.fillRect(-190, -265, 380, 30);
  ctx.fillStyle = '#E3E7EF'; ctx.fillRect(-420, -235, 840, 90);
  text('M I T', 0, -190, 60, '#4A5470', { weight: 900 });
  for (let i = 0; i < 8; i++) { const x = -370 + i * 105.7; ctx.fillStyle = '#D5DAE4'; ctx.fillRect(x - 24, -145, 48, 330); ctx.fillStyle = '#B8BFCD'; ctx.fillRect(x + 10, -145, 10, 330); }
  ctx.fillStyle = '#E3E7EF'; ctx.fillRect(-450, 185, 900, 35); ctx.fillStyle = '#C9CFDB'; ctx.fillRect(-480, 220, 960, 35);
}
function drawTicket(t) {
  ctx.save();
  ctx.shadowColor = C.gold; ctx.shadowBlur = 40;
  rr(-280, -130, 560, 260, 24); ctx.fillStyle = '#FF8A3D'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(-280, 0, 36, 0, 7); ctx.arc(280, 0, 36, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.setLineDash([14, 12]); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(150, -110); ctx.lineTo(150, 110); ctx.stroke(); ctx.setLineDash([]);
  text('🏀', -175, 0, 120, '#fff');
  text('BIG GAME', -10, -40, 54, '#fff', { weight: 900 });
  text('COURTSIDE', -10, 25, 36, '#FFE3CC', { weight: 800 });
  text('ADMIT', 215, -20, 30, '#fff', { weight: 900 }); text('ONE', 215, 20, 30, '#fff', { weight: 900 });
  ctx.restore();
}
function drawStamp(str, color, k) {
  ctx.save(); ctx.globalAlpha = clamp(k * 1.5);
  ctx.lineWidth = 12; ctx.strokeStyle = color;
  ctx.font = `900 96px ${FONT}`; const w = ctx.measureText(str).width + 70;
  rr(-w / 2, -75, w, 150, 18); ctx.stroke();
  text(str, 0, 4, 96, color);
  ctx.restore();
}
function pill(str, y, color, k) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(k);
  ctx.font = `900 46px ${FONT}`; const w = ctx.measureText(str).width + 80;
  withT(W / 2, y, lerp(.6, 1, easeBack(clamp(k))), 0, () => {
    rr(-w / 2, -42, w, 84, 42); ctx.fillStyle = color; ctx.fill();
    text(str, 0, 3, 46, color === C.gold ? C.ink : '#fff');
  });
  ctx.restore();
}

// ---------- background ----------
const PARTS = Array.from({ length: 70 }, (_, i) => ({ x: rnd(i + 1) * W, y: rnd(i + 99) * H, s: 2 + rnd(i + 7) * 5, v: 10 + rnd(i + 3) * 40, p: rnd(i + 11) * 6 }));
function background(t, tint) {
  const g = ctx.createRadialGradient(W / 2, H * .38, 80, W / 2, H * .45, H * .8);
  g.addColorStop(0, C.navy2); g.addColorStop(1, '#050A18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (tint) glowCircle(W / 2, H * .4, 900, tint, .22);
  for (const p of PARTS) {
    const y = ((p.y - t * p.v) % H + H) % H;
    ctx.globalAlpha = .25 + .35 * (.5 + .5 * Math.sin(t * 2 + p.p));
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(p.x, y, p.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- scenes ----------
// each scene: (t, lt, d, L) where lt = local time, d = scene length, L = line start times for this scene
// Video 4 — "$5 a Day → $206,742" (two brothers, compound interest). Light/warm palette test.
// Spliced into scene.html between the shared drawing kit and the caption/main code.

const INK = '#1B2440', GRASS = '#7CC36E', CREAM = '#FFF4DF';
const RATE = .08, PER_YEAR = 5 * 365;
const fv = y => PER_YEAR * ((Math.pow(1 + RATE, y) - 1) / RATE);
const money = v => '$' + Math.round(v).toLocaleString('en-US');

function wordAt(w, from = 0) {
  for (const l of T.lines) for (const x of l.words) {
    if (x.s >= from && x.w.toLowerCase().replace(/[^a-z0-9$]/g, '') === w) return x.s;
  }
  return 1e9;
}

function glowSoft(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

function bgLight(t, tint) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FFF8EA'); g.addColorStop(.6, '#FCE7C4'); g.addColorStop(1, '#F6D9A8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (tint) glowSoft(W / 2, 700, 700, tint, .25);
  // soft sun + grass strip the characters stand on
  glowSoft(900, 420, 240, '255,200,80', .55);
  ctx.beginPath(); ctx.arc(900, 420, 70, 0, 7); ctx.fillStyle = '#FFD36B'; ctx.fill();
  ctx.fillStyle = GRASS; ctx.fillRect(0, 1095, W, 140);
  ctx.fillStyle = '#69B05C'; ctx.fillRect(0, 1095, W, 14);
  ctx.fillStyle = '#E9C48C'; ctx.fillRect(0, 1235, W, H - 1235);
}

function inkText(str, x, y, size, col = INK, opts = {}) {
  text(str, x, y, size, col, Object.assign({ stroke: '#fff', strokeW: size * .14 }, opts));
}

function lightPill(str, y, col, k) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(k);
  ctx.font = `900 46px ${FONT}`; const w = ctx.measureText(str).width + 80;
  withT(W / 2, y, lerp(.6, 1, easeBack(clamp(k))), 0, () => {
    rr(-w / 2, -42, w, 84, 42); ctx.fillStyle = col; ctx.fill();
    text(str, 0, 3, 46, '#fff');
  });
  ctx.restore();
}

// simple flat character; mood: happy | sad | neutral
function brother(x, y, s, shirt, mood, t, seed = 0) {
  const b = Math.sin(t * 3 + seed) * 4;
  withT(x, y + b, s, 0, () => {
    ctx.fillStyle = '#2B3550';
    rr(-38, 60, 30, 110, 12); ctx.fill(); rr(8, 60, 30, 110, 12); ctx.fill();
    rr(-62, -60, 124, 140, 46); ctx.fillStyle = shirt; ctx.fill();
    ctx.beginPath(); ctx.arc(0, -120, 58, 0, 7); ctx.fillStyle = '#F2C6A0'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, -138, 60, Math.PI * 1.05, Math.PI * 1.95); ctx.fillStyle = '#3A2A20'; ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-20, -118, 6, 0, 7); ctx.arc(20, -118, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
    if (mood === 'happy') ctx.arc(0, -102, 18, .2, Math.PI - .2);
    else if (mood === 'sad') ctx.arc(0, -82, 16, Math.PI + .4, -.4);
    else { ctx.moveTo(-12, -92); ctx.lineTo(12, -92); }
    ctx.stroke();
  });
}

function nameTag(str, x, y, col) {
  ctx.font = `900 40px ${FONT}`; const w = ctx.measureText(str).width + 44;
  rr(x - w / 2, y - 30, w, 60, 30); ctx.fillStyle = col; ctx.fill();
  text(str, x, y + 2, 40, '#fff');
}

function paperCup(x, y, s, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-34, -50); ctx.lineTo(34, -50); ctx.lineTo(26, 50); ctx.lineTo(-26, 50); ctx.closePath();
  ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = '#C9B79C'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#9C6B3F'; ctx.fillRect(-31, -12, 62, 26);
  rr(-40, -62, 80, 16, 6); ctx.fillStyle = '#5A3A22'; ctx.fill();
  ctx.restore();
}

function cashStack(x, base, h) {
  const n = Math.floor(h / 22);
  for (let i = 0; i < n; i++) withT(x + Math.sin(i * 1.7) * 6, base - i * 22, .62, 0, () => drawBill(240));
}

function yearBadge(y, k) {
  if (k <= 0) return;
  withT(W / 2, 420, k, 0, () => {
    rr(-170, -70, 340, 140, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
    rr(-170, -70, 340, 50, 24); ctx.fillStyle = C.red; ctx.fill(); ctx.fillRect(-170, -40, 340, 20);
    text('YEAR', 0, -45, 34, '#fff');
    text(String(Math.round(y)), 0, 25, 80, INK);
  });
}

function hookTitle(k) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(k);
  inkText('$5 A DAY', W / 2, 205, 118);
  inkText('→ $206,742?', W / 2, 330, 118, '#1E9E5A', { glow: 'rgba(30,158,90,.5)', glowBlur: 30 });
  ctx.restore();
}

function hookScene(t, k) {
  withT(0, 0, 1, 0, () => {
    ctx.globalAlpha = clamp(k);
    brother(300, 930, 1.05, '#F08A3C', 'neutral', t, 0);
    brother(780, 930, 1.05, '#3C7DF0', 'neutral', t, 2);
    nameTag('MAX', 300, 700, '#F08A3C'); nameTag('LEO', 780, 700, '#3C7DF0');
    withT(300, 590 - Math.abs(Math.sin(t * 3)) * 16, 1, 0, () => { drawCoin(52); });
    withT(780, 590 - Math.abs(Math.sin(t * 3 + 1)) * 16, 1, 0, () => { drawCoin(52); });
    ctx.globalAlpha = 1;
  });
}

const SCENES = {
  1(t, lt, d, L) {
    bgLight(t);
    hookTitle(1);
    hookScene(t, 1);
    const k = pop(t, wordAt('same', T.lines[0].start + 1.2), .3);
    if (k > 0) withT(W / 2, 600, k, 0, () => inkText('=', 0, 0, 110, C.red));
  },
  2(t, lt, d, L) {
    bgLight(t);
    const cof = wordAt('coffee'), inv = wordAt('invests');
    brother(300, 930, 1.05, '#F08A3C', t > cof ? 'happy' : 'neutral', t, 0);
    brother(780, 930, 1.05, '#3C7DF0', t > inv ? 'happy' : 'neutral', t, 2);
    nameTag('MAX', 300, 700, '#F08A3C'); nameTag('LEO', 780, 700, '#3C7DF0');
    // Max: coin -> coffee
    const a = easeInOut(prog(t, cof - .2, .5));
    if (a < 1) withT(300, lerp(590, 820, a), 1 - a * .5, 0, () => drawCoin(52));
    if (t > cof) { withT(400, 860, pop(t, cof + .1, .35), -.1, () => text('☕', 0, 0, 130, '#fff')); inkText('SPEND', 300, 470, 72, '#E06A1E'); }
    // Leo: coin -> piggy bank, sapling sprouts
    const b = easeInOut(prog(t, inv - .2, .5));
    if (b < 1) withT(780, lerp(590, 820, b), 1 - b * .5, 0, () => drawCoin(52));
    if (t > inv) {
      withT(890, 900, pop(t, inv + .1, .35), 0, () => text('🐷', 0, 0, 130, '#fff'));
      withT(670, 1050 - 40 * easeOut(prog(t, inv + .6, 1)), pop(t, inv + .5, .35), 0, () => text('🌱', 0, 0, 90, '#fff'));
      inkText('INVEST', 780, 470, 72, '#1E9E5A');
    }
  },
  3(t, lt, d, L) {
    bgLight(t, '255,211,107');
    lightPill('ONE YEAR', 250, C.red, prog(lt, .05, .3));
    // day counter
    const l3 = T.lines[3].start, tTotal = wordAt('$1825', l3);
    const day = Math.max(1, Math.round(365 * easeInOut(prog(t, l3, tTotal - l3))));
    withT(W / 2, 560, pop(lt, .1, .35), 0, () => {
      rr(-190, -150, 380, 300, 34); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
      rr(-190, -150, 380, 80, 30); ctx.fillStyle = C.red; ctx.fill(); ctx.fillRect(-190, -100, 380, 30);
      text('DAY', 0, -110, 46, '#fff'); text(String(day), 0, 45, 130, INK);
    });
    // equation types itself in
    const parts = [['$5', INK], ['×', C.red], ['365', INK], ['=', C.red], ['$1,825', '#1E9E5A']];
    // each piece pops on the word that says it
    const st = [wordAt('$5', l3), wordAt('day', l3), wordAt('day', l3) + .2, wordAt('is', l3), tTotal];
    ctx.font = `900 96px ${FONT}`;
    const ws = parts.map(p => ctx.measureText(p[0]).width + 28);
    let x = W / 2 - ws.reduce((a, b) => a + b) / 2;
    parts.forEach(([s, col], i) => {
      const k = pop(t, st[i], .3);
      if (k > 0) withT(x + ws[i] / 2, 900, k, 0, () => inkText(s, 0, 0, 96, col));
      x += ws[i];
    });
    if (t > wordAt('year', l3)) withT(W / 2, 1040, pop(t, wordAt('year', l3), .3), 0, () => inkText('PER YEAR', 0, 0, 56, '#1E9E5A'));
  },
  4(t, lt, d, L) {
    bgLight(t);
    const y = lt < L[1] ? 10 * easeInOut(prog(lt, .2, 3.2)) : 10 + 10 * easeInOut(prog(lt, L[1] - .1, .75));
    yearBadge(y, pop(lt, 0, .35));
    // Max: pile of empty cups grows with the years
    const cups = Math.floor(y * 1.4);
    for (let i = 0; i < cups; i++) paperCup(70 + (i % 5) * 52, 1080 - Math.floor(i / 5) * 62, .65);
    brother(390, 990, .8, '#F08A3C', 'sad', t, 0); nameTag('MAX', 390, 810, '#F08A3C');
    // Leo: cash stack + live counter
    cashStack(680, 1060, 40 + Math.min(fv(y) / 83516 * 330, 400));
    brother(880, 990, .8, '#3C7DF0', 'happy', t, 2); nameTag('LEO', 880, 810, '#3C7DF0');
    withT(760, 590, 1, 0, () => inkText(money(fv(y)), 0, 0, 84, '#1E9E5A'));
    inkText('*8% avg. yearly return · illustrative', W / 2, 1290, 30, '#6B5B45', { weight: 700 });
  },
  5(t, lt, d, L) {
    bgLight(t, '124,240,165');
    const y = 20 + 10 * easeInOut(prog(lt, 0, 1.2));
    yearBadge(y, 1);
    for (let i = 0; i < 30; i++) paperCup(70 + (i % 5) * 52, 1080 - Math.floor(i / 5) * 62, .65);
    brother(390, 990, .8, '#F08A3C', 'sad', t, 0); nameTag('MAX', 390, 810, '#F08A3C');
    cashStack(680, 1060, 40 + Math.min(fv(y) / 83516 * 330, 400));
    brother(880, 990, .8, '#3C7DF0', 'happy', t, 2); nameTag('LEO', 880, 810, '#3C7DF0');
    const big = lt > 1.2 ? 1 + .04 * Math.sin(t * 7) : 1;
    withT(760, 590, big, 0, () => inkText(money(fv(y)), 0, 0, 92, '#1E9E5A', { glow: 'rgba(30,158,90,.6)', glowBlur: 30 }));
    if (lt > L[1]) {
      withT(250, 560, pop(lt, L[1] + .3, .35), -.05, () => {
        inkText(money(PER_YEAR * 30), 0, -40, 70, C.red);
        inkText('SPENT', 0, 40, 56, C.red);
      });
      const sk = prog(t, wordAt('nothing'), .2);
      if (sk > 0) withT(270, 1180, lerp(2.2, 1, easeOut(sk)), -.08, () => drawStamp('$0 LEFT', C.red, sk));
    }
    inkText('*8% avg. yearly return · illustrative', W / 2, 1290, 30, '#6B5B45', { weight: 700 });
  },
  6(t, lt, d, L) {
    bgLight(t, '255,211,107');
    lightPill('COMPOUND INTEREST', 250, '#1E9E5A', prog(lt, .05, .3));
    // money tree: each coin spawns two more
    const rows = 4;
    for (let r = 0; r < rows; r++) {
      const n = 1 << r, k = pop(lt, .3 + r * .75, .35);
      if (k <= 0) continue;
      for (let i = 0; i < n; i++) {
        const x = W / 2 + (i - (n - 1) / 2) * (900 / Math.max(n, 2)) * (r ? 1 : 0), y = 460 + r * 175;
        if (r) {
          const px = W / 2 + (Math.floor(i / 2) - ((n / 2) - 1) / 2) * (900 / Math.max(n / 2, 2)) * (r > 1 ? 1 : 0), py = 460 + (r - 1) * 175;
          ctx.strokeStyle = 'rgba(27,36,64,.35)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(px, py + 40); ctx.lineTo(x, y - 40); ctx.stroke();
        }
        withT(x, y, k * (1 - r * .12), 0, () => drawCoin(56));
      }
    }
    if (lt > 3.2) withT(W / 2, 1180, pop(lt, 3.2, .3), 0, () => inkText('MONEY → MORE MONEY', 0, 0, 64, '#1E9E5A'));
  },
  7(t, lt, d, L) {
    bgLight(t, '255,211,107');
    const a = pop(t, wordAt('money', T.lines[9].start), .35), b = pop(t, wordAt('years'), .35);
    if (a > 0) withT(W / 2, 520, a, -.03, () => {
      inkText('MORE MONEY', 0, 0, 104, '#8C7A62');
      ctx.strokeStyle = C.red; ctx.lineWidth = 16; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-330, 10); ctx.lineTo(330, -10); ctx.stroke();
    });
    if (b > 0) withT(W / 2, 760, b, .03, () => inkText('MORE YEARS', 0, 0, 120, '#1E9E5A', { glow: 'rgba(30,158,90,.5)', glowBlur: 30 }));
    withT(W / 2, 1000, pop(lt, .1, .35), Math.sin(t * 2) * .2, () => text('⏳', 0, 0, 150, '#fff'));
  },
  8(t, lt, d, L) {
    // "which brother are you?" -> rebuild the opening frame for a seamless loop
    bgLight(t);
    const q = pop(lt, .05, .35) * (1 - prog(lt, 1.0, .25));
    if (q > 0) withT(W / 2, 620, q, -.03, () => {
      inkText('WHICH', 0, -120, 120); inkText('BROTHER', 0, 0, 120, '#E06A1E'); inkText('ARE YOU?', 0, 120, 120);
    });
    const f = pop(lt, .3, .3) * (1 - prog(lt, 1.0, .25));
    if (f > 0) withT(W / 2, 1180, f, 0, () => { rr(-210, -50, 420, 100, 50); ctx.fillStyle = '#FF0033'; ctx.fill(); text('FOLLOW 🧠', 0, 3, 50, '#fff'); });
    const k = easeOut(prog(lt, 1.05, .5));
    if (k > 0) { hookTitle(k); hookScene(t, k); }
  },
};

// ---------- captions ----------
let CHUNKS = null;
function buildChunks() {
  CHUNKS = [];
  for (const [li, line] of T.lines.entries()) {
    let cur = [];
    const flush = () => { if (cur.length) CHUNKS.push({ words: cur, line: li }); cur = []; };
    for (const w of line.words) {
      cur.push(w);
      if (/[.,?!]$/.test(w.w) || cur.length >= 3) flush();
    }
    flush();
  }
  for (let i = 0; i < CHUNKS.length; i++) {
    const c = CHUNKS[i], nx = CHUNKS[i + 1];
    c.s = c.words[0].s;
    const last = c.words[c.words.length - 1].e;
    c.e = nx ? Math.min(nx.words[0].s, last + .5) : last + .8;
  }
}
const HL = new Set(["BROTHERS.", "COFFEE.", "INVESTS", "$1,825", "CUPS.", "$26,438.", "$83,516.", "$206,742.", "$54,750", "NOTHING", "INTEREST.", "TOO.", "YEARS.", "YOU?"]);
function captions(t) {
  if (!CHUNKS) buildChunks();
  const c = CHUNKS.find(c => t >= c.s && t < c.e);
  if (!c) return;
  const y = 1390, size0 = 86;
  ctx.save();
  let size = size0;
  const words = c.words.map(w => w.w.toUpperCase());
  ctx.font = `900 ${size}px ${FONT}`;
  const sp = size * .34;
  let total = words.reduce((a, w) => a + ctx.measureText(w).width, 0) + sp * (words.length - 1);
  if (total > 940) { size = size * 940 / total; ctx.font = `900 ${size}px ${FONT}`; total = 940; }
  const k = easeBack(prog(t, c.s, .14));
  ctx.translate(W / 2, y); ctx.scale(lerp(.8, 1, k), lerp(.8, 1, k)); ctx.translate(-W / 2, -y);
  let x = W / 2 - total / 2;
  c.words.forEach((w, i) => {
    const str = words[i], ww = ctx.measureText(str).width;
    const active = t >= w.s && t < w.e;
    const said = t >= w.s;
    const col = active ? (HL.has(str) ? C.red : C.gold2) : (said ? '#fff' : 'rgba(255,255,255,.9)');
    const s = active ? 1.06 : 1;
    withT(x + ww / 2, y, s, 0, () => text(str, 0, 0, size, col, { stroke: C.ink, strokeW: size * .2 }));
    x += ww + sp;
  });
  ctx.restore();
}

// ---------- main ----------
function sceneAt(t) {
  const ids = Object.keys(T.scenes).map(Number).sort((a, b) => a - b);
  let id = ids[0];
  for (const i of ids) if (t >= (i === 1 ? 0 : T.scenes[i][0] - .15)) id = i;
  return id;
}
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const id = sceneAt(t);
  const s0 = id === 1 ? 0 : T.scenes[id][0] - .15;
  const next = T.scenes[id + 1];
  const s1 = next ? next[0] - .15 : T.total;
  // line start times relative to the scene start
  const L = T.lines.filter(l => l.scene === id).map(l => l.start - s0);
  const lt = t - s0;
  // camera punch-in on scene start
  const ck = prog(lt, 0, .35);
  ctx.save();
  const z = lerp(1.08, 1, easeOut(ck)) + lt * .004;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES[id](t, lt, s1 - s0, L);
  ctx.restore();
  // transition flash
  if (id !== 1 && lt < .18) { ctx.fillStyle = `rgba(255,255,255,${(1 - lt / .18) * .35})`; ctx.fillRect(0, 0, W, H); }
  captions(t);
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = C.gold; ctx.fillRect(0, 0, W * clamp(t / T.total), 10);
};
