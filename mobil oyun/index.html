<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kes Kes Bahçe</title>
<meta name="theme-color" content="#2b1a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #1c110a;
    --gold: #ffcf4a; --gold-deep: #8a3a00; --red: #ff4a4a; --text: #fff7e8;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: var(--body); color: var(--text);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
  }
  #score { font-family: var(--display); font-size: 48px; line-height: 1; color: var(--gold);
    text-shadow: 0 4px 0 var(--gold-deep), 0 0 18px #0009; transform-origin: left center; }
  #best { font-size: 14px; font-weight: 800; opacity: .8; margin-top: 6px; }
  #right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #lives { font-size: 30px; letter-spacing: 2px; filter: drop-shadow(0 2px 2px #0008); }
  #timer { font-family: var(--display); font-size: 36px; line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--gold-deep); }
  .iconBtn {
    pointer-events: auto; background: #0007; border: 2px solid #fff3; color: var(--text);
    border-radius: 14px; font-size: 18px; width: 46px; height: 46px; cursor: pointer;
  }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
    text-align: center; background: radial-gradient(circle at 50% 40%, #0004, #000b);
  }
  .hidden { display: none !important; }
  h1 {
    font-family: var(--display); font-weight: 400;
    margin: 0 0 6px; font-size: clamp(48px, 14vw, 84px); line-height: .95; color: var(--gold);
    text-shadow: 0 6px 0 var(--gold-deep), 0 10px 24px #000a, 0 0 40px #ff8a0066; transform: rotate(-4deg);
    animation: bob 2.4s ease-in-out infinite;
  }
  h1 .l2 { color: #9ef07a; text-shadow: 0 6px 0 #1f6a10, 0 10px 24px #000a; }
  @keyframes bob { 50% { transform: rotate(-2deg) translateY(-6px); } }
  .sub { opacity: .9; margin: 0 0 8px; max-width: 340px; font-weight: 600; line-height: 1.4; text-wrap: balance; }
  .btn {
    width: min(300px, 100%); padding: 14px 20px; font-family: var(--display); font-size: 24px; letter-spacing: .5px;
    border: none; border-radius: 18px; color: #3a1f08; cursor: pointer;
    background: linear-gradient(#ffe48a, #ffb020); box-shadow: 0 6px 0 #a8650a, 0 10px 20px #0007;
    transition: transform .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8650a; }
  .btn:focus-visible, .iconBtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.alt { background: linear-gradient(#b4f590, #4fc030); box-shadow: 0 6px 0 #2b7a14, 0 10px 20px #0007; color: #143a08; }
  .btn.alt2 { background: linear-gradient(#a8e2ff, #3aa0f0); box-shadow: 0 6px 0 #1a5a9a, 0 10px 20px #0007; color: #0a2a4a; }
  .btn small { display: block; font-family: var(--body); font-size: 13px; font-weight: 800; opacity: .75; letter-spacing: 0; }
  #finalScore { font-family: var(--display); font-size: 80px; line-height: 1; color: var(--gold); text-shadow: 0 6px 0 var(--gold-deep); }
  #newBest { color: #9ef07a; font-weight: 900; font-size: 20px; }
  #muteBtn { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div>
    <div id="score">0</div>
    <div id="best">En iyi: 0</div>
  </div>
  <div id="right">
    <div id="lives"></div>
    <div id="timer" class="hidden">60</div>
    <button id="pauseBtn" class="iconBtn" aria-label="Duraklat">⏸</button>
  </div>
</div>

<div id="menu" class="screen">
  <h1>Kes Kes<br><span class="l2">Bahçe!</span></h1>
  <p class="sub">Parmağını kaydırıp meyveleri kes. Bombalara dokunma! Tek hamlede çok meyve kesersen kombo kazanırsın.</p>
  <button class="btn" data-mode="classic">Klasik<small>3 can · bombalara dikkat</small></button>
  <button class="btn alt" data-mode="timed">Süreli<small>60 saniye · bomba −10 puan</small></button>
  <button class="btn alt2" data-mode="zen">Zen<small>90 saniye · bomba yok</small></button>
</div>

<div id="pauseScreen" class="screen hidden">
  <h1>Mola</h1>
  <button class="btn" id="resumeBtn">Devam Et</button>
  <button class="btn alt2" id="quitBtn">Ana Menü</button>
</div>

<div id="over" class="screen hidden">
  <h1 id="overTitle">Oyun Bitti</h1>
  <div id="finalScore">0</div>
  <div id="newBest" class="hidden">🏆 Yeni rekor!</div>
  <div id="stats" class="sub"></div>
  <button class="btn" id="againBtn">Tekrar Oyna</button>
  <button class="btn alt2" id="menuBtn">Ana Menü</button>
</div>

<button id="muteBtn" class="iconBtn" aria-label="Ses">🔊</button>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, S = 1;
  let bgCanvas = null;

  // ---------- Kayıt ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- Ses ----------
  let actx = null, muted = store.get('kkb_muted', false);
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol = 0.3, freq = 1200) {
    if (muted) return; const a = audio(); if (!a) return;
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
  }
  const sfx = {
    slice() { noise(0.12, 0.35, 2500 + Math.random() * 1500); tone(600 + Math.random() * 300, 0.08, 'triangle', 0.08, -300); },
    swoosh() { noise(0.15, 0.08, 800); },
    launch() { tone(180, 0.15, 'sine', 0.05, 120); },
    bomb() { noise(0.6, 0.7, 300); tone(90, 0.5, 'sawtooth', 0.25, -60); },
    miss() { tone(300, 0.25, 'square', 0.08, -150); },
    combo(n) { [0, 1, 2].forEach(i => setTimeout(() => tone(500 + n * 60 + i * 180, 0.12, 'triangle', 0.12), i * 70)); },
    special() { tone(880, 0.3, 'sine', 0.15, 440); },
  };
  const muteBtn = document.getElementById('muteBtn');
  function updMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  updMute();
  muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); muted = !muted; store.set('kkb_muted', muted); updMute(); });

  // ---------- Meyve tanımları ----------
  function randDisk(n) { const a = []; for (let i = 0; i < n; i++) { const t = Math.random() * TAU, d = Math.sqrt(Math.random()); a.push([Math.cos(t) * d, Math.sin(t) * d, Math.random()]); } return a; }
  const FRUITS = [
    { name: 'karpuz',   r: 54, skin: '#3aa040', skin2: '#1a5a1e', rind: '#e4f7c0', flesh: '#ff3b4f', juice: '#ff3b55', fleshScale: 0.8 },
    { name: 'portakal', r: 40, skin: '#ff9a1a', skin2: '#d06a00', rind: '#fff4dc', flesh: '#ffb22e', juice: '#ffa21a', fleshScale: 0.86, citrus: true },
    { name: 'limon',    r: 36, skin: '#ffe23a', skin2: '#d0aa00', rind: '#fffbe0', flesh: '#fff07a', juice: '#ffe94a', fleshScale: 0.86, citrus: true, shape: 'lemon' },
    { name: 'elma',     r: 39, skin: '#e8243a', skin2: '#8a0e1a', rind: '#fff3d0', flesh: '#fff3d0', juice: '#fff0b8', fleshScale: 0.93, shape: 'apple' },
    { name: 'nar',      r: 42, skin: '#c0182e', skin2: '#6a0614', rind: '#ffe6d6', flesh: '#ffdccc', juice: '#d8103a', fleshScale: 0.9 },
    { name: 'kivi',     r: 34, skin: '#9a7440', skin2: '#5a4020', rind: '#7ac030', flesh: '#8ad83a', juice: '#9ae04a', fleshScale: 0.94, oval: 1.22 },
    { name: 'şeftali',  r: 38, skin: '#ffb070', skin2: '#e0604a', rind: '#ffd88a', flesh: '#ffc860', juice: '#ffb070', fleshScale: 0.94 },
  ];
  const GOLDEN = { name: 'altın', r: 40, skin: '#ffd700', skin2: '#b8860b', rind: '#fff6c0', flesh: '#ffe680', juice: '#ffe14a', fleshScale: 0.88, golden: true, pts: 5 };
  const FREEZE = { name: 'buz',   r: 38, skin: '#a8ecff', skin2: '#2a90d0', rind: '#ffffff', flesh: '#d8f6ff', juice: '#c8f2ff', fleshScale: 0.88, freeze: true, pts: 2 };
  [...FRUITS, GOLDEN, FREEZE].forEach(d => { d.pts = d.pts || 1; d.dots = randDisk(60); d.dots2 = randDisk(70); });

  // ---------- Şekiller ----------
  function shapePath(c, def, r) {
    c.beginPath();
    if (def.shape === 'apple') {
      c.moveTo(0, -r * 0.7);
      c.bezierCurveTo(r * 0.45, -r * 1.08, r * 1.08, -r * 0.8, r * 1.02, -r * 0.05);
      c.bezierCurveTo(r * 0.98, r * 0.62, r * 0.55, r * 1.0, r * 0.18, r * 0.95);
      c.quadraticCurveTo(0, r * 0.88, -r * 0.18, r * 0.95);
      c.bezierCurveTo(-r * 0.55, r * 1.0, -r * 0.98, r * 0.62, -r * 1.02, -r * 0.05);
      c.bezierCurveTo(-r * 1.08, -r * 0.8, -r * 0.45, -r * 1.08, 0, -r * 0.7);
      c.closePath();
    } else if (def.shape === 'lemon') {
      for (let i = 0; i <= 72; i++) {
        const t = i / 72 * TAU, co = Math.cos(t), si = Math.sin(t);
        const tip = Math.sign(co) * Math.pow(Math.abs(co), 16) * r * 0.22;
        const x = co * r * 1.12 + tip, y = si * r * 0.9;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath();
    } else {
      c.ellipse(0, 0, r * (def.oval || 1), r, 0, 0, TAU);
    }
  }
  function lighten(hex, amt = 70) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, (n >> 16) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
    return `rgb(${r},${g},${b})`;
  }
  function leaf(c, x, y, len, ang) {
    c.save(); c.translate(x, y); c.rotate(ang);
    const g = c.createLinearGradient(0, -len * 0.3, 0, len * 0.3); g.addColorStop(0, '#7ed048'); g.addColorStop(1, '#2e8a1e');
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(len * 0.5, -len * 0.45, len, 0); c.quadraticCurveTo(len * 0.5, len * 0.45, 0, 0); c.fill();
    c.strokeStyle = '#1e5a12'; c.lineWidth = Math.max(1, len * 0.05); c.beginPath(); c.moveTo(0, 0); c.lineTo(len * 0.85, 0); c.stroke();
    c.restore();
  }

  // Bütün meyve
  function drawWhole(c, def, r) {
    shapePath(c, def, r);
    const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r * 1.15);
    g.addColorStop(0, lighten(def.skin, 80)); g.addColorStop(0.5, def.skin); g.addColorStop(1, def.skin2);
    c.fillStyle = g; c.fill();
    c.save(); shapePath(c, def, r); c.clip();
    const ov = def.oval || 1;
    switch (def.name) {
      case 'karpuz': {
        c.strokeStyle = def.skin2; c.lineWidth = r * 0.15; c.lineCap = 'round';
        for (let i = -4; i <= 4; i++) {
          c.beginPath();
          for (let k = 0; k <= 24; k++) {
            const y = -r + (k / 24) * 2 * r, q = Math.sqrt(Math.max(0, 1 - (y / r) ** 2));
            const x = Math.sin(i * 0.36) * r * q + Math.sin(y / r * 10 + i * 2) * r * 0.04;
            k ? c.lineTo(x, y) : c.moveTo(x, y);
          }
          c.stroke();
        }
        c.fillStyle = 'rgba(200,255,170,0.15)';
        def.dots.forEach(([x, y]) => { c.beginPath(); c.arc(x * r, y * r, r * 0.03, 0, TAU); c.fill(); });
        break;
      }
      case 'portakal': case 'limon': case 'altın':
        def.dots.forEach(([x, y, z]) => {
          c.fillStyle = z > 0.5 ? 'rgba(0,0,0,0.13)' : 'rgba(255,255,255,0.18)';
          c.beginPath(); c.arc(x * r * 1.1, y * r, r * 0.028, 0, TAU); c.fill();
        });
        break;
      case 'elma': {
        const s = c.createLinearGradient(-r, 0, r, 0);
        s.addColorStop(0, 'rgba(255,220,80,0.45)'); s.addColorStop(0.35, 'rgba(255,220,80,0)');
        c.fillStyle = s; c.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * 2.4);
        c.fillStyle = 'rgba(255,240,200,0.35)';
        def.dots.slice(0, 30).forEach(([x, y]) => { c.beginPath(); c.arc(x * r, y * r, r * 0.018, 0, TAU); c.fill(); });
        break;
      }
      case 'nar':
        c.strokeStyle = 'rgba(255,150,120,0.07)'; c.lineWidth = r * 0.04;
        for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(0, 0, Math.abs(i) * r * 0.3 + 1, r, 0, 0, TAU); c.stroke(); }
        break;
      case 'kivi':
        c.strokeStyle = 'rgba(70,45,15,0.45)'; c.lineWidth = 1.2;
        def.dots2.forEach(([x, y, z]) => { const a = z * TAU; c.beginPath(); c.moveTo(x * r * ov, y * r); c.lineTo(x * r * ov + Math.cos(a) * r * 0.08, y * r + Math.sin(a) * r * 0.08); c.stroke(); });
        break;
      case 'şeftali': {
        const b = c.createRadialGradient(r * 0.35, r * 0.15, 0, r * 0.35, r * 0.15, r * 0.95);
        b.addColorStop(0, 'rgba(230,40,50,0.6)'); b.addColorStop(1, 'rgba(230,40,50,0)');
        c.fillStyle = b; c.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * 2.4);
        c.strokeStyle = 'rgba(150,40,30,0.35)'; c.lineWidth = r * 0.05;
        c.beginPath(); c.moveTo(-r * 0.05, -r * 0.95); c.quadraticCurveTo(-r * 0.4, 0, -r * 0.05, r * 0.95); c.stroke();
        break;
      }
      case 'buz':
        c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 1.5;
        for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); c.stroke(); }
        c.beginPath(); for (let i = 0; i <= 6; i++) { const a = i / 6 * TAU; c.lineTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55); } c.stroke();
        break;
    }
    // kenar gölgesi
    const sh = c.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.45, 0, 0, r * 1.15);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.38)');
    c.fillStyle = sh; c.fillRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
    // alt yansıma ışığı
    const rim = c.createRadialGradient(r * 0.45, r * 0.6, 0, r * 0.45, r * 0.6, r * 0.6);
    rim.addColorStop(0, 'rgba(255,230,190,0.18)'); rim.addColorStop(1, 'rgba(255,230,190,0)');
    c.fillStyle = rim; c.fillRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
    // parlama
    const sp = c.createRadialGradient(-r * 0.38, -r * 0.45, 0, -r * 0.38, -r * 0.45, r * 0.5);
    sp.addColorStop(0, 'rgba(255,255,255,0.85)'); sp.addColorStop(0.25, 'rgba(255,255,255,0.35)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sp; c.fillRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
    c.restore();
    c.lineWidth = Math.max(1.5, r * 0.035); c.strokeStyle = 'rgba(30,10,0,0.45)'; shapePath(c, def, r); c.stroke();
    // ekler
    if (def.name === 'elma') {
      c.strokeStyle = '#5a3418'; c.lineWidth = r * 0.1; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -r * 0.7); c.quadraticCurveTo(r * 0.05, -r * 1.05, r * 0.12, -r * 1.22); c.stroke();
      leaf(c, r * 0.1, -r * 1.0, r * 0.6, -0.45);
    } else if (def.name === 'şeftali') {
      leaf(c, -r * 0.05, -r * 0.92, r * 0.55, -0.9);
    } else if (def.name === 'nar') {
      c.fillStyle = def.skin2; c.strokeStyle = 'rgba(30,0,0,0.5)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(-r * 0.3, -r * 0.88);
      for (let i = 0; i < 6; i++) { const x = -r * 0.3 + (i + 0.5) * r * 0.1; c.lineTo(x, -r * (1.22 - (i % 2) * 0.06)); c.lineTo(x + r * 0.05, -r * 0.95); }
      c.lineTo(r * 0.3, -r * 0.88); c.closePath(); c.fill(); c.stroke();
    } else if (def.name === 'portakal') {
      c.fillStyle = '#4a8a20'; c.beginPath(); c.arc(0, -r * 0.93, r * 0.09, 0, TAU); c.fill();
      leaf(c, r * 0.05, -r * 0.95, r * 0.45, -0.3);
    } else if (def.name === 'altın') {
      c.fillStyle = '#fffbe0';
      [[-0.5, -0.1, 0.12], [0.35, -0.5, 0.09], [0.4, 0.4, 0.07]].forEach(([x, y, s]) => star(c, x * r, y * r, s * r));
    }
  }
  function star(c, x, y, s) {
    c.beginPath();
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, d = i % 2 ? s * 0.3 : s; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
    c.closePath(); c.fill();
  }

  // Kesit (iç görünüm)
  function drawCut(c, def, r) {
    shapePath(c, def, r);
    c.fillStyle = def.skin2; c.fill();
    c.save(); c.scale(0.94, 0.94); shapePath(c, def, r); c.fillStyle = def.skin; c.fill(); c.restore();
    c.save(); c.scale(def.fleshScale + 0.06, def.fleshScale + 0.06); shapePath(c, def, r); c.fillStyle = def.rind; c.fill(); c.restore();
    const fs = def.fleshScale;
    c.save(); c.scale(fs, fs); shapePath(c, def, r);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, lighten(def.flesh, 50)); g.addColorStop(0.7, def.flesh); g.addColorStop(1, lighten(def.flesh, -30));
    c.fillStyle = g; c.fill(); c.clip();
    const ov = def.oval || 1;
    switch (def.name) {
      case 'karpuz':
        c.fillStyle = '#1a0a08';
        for (let i = 0; i < 16; i++) {
          const a = i / 16 * TAU, d = r * (0.5 + (i % 2) * 0.13);
          c.beginPath(); c.ellipse(Math.cos(a) * d, Math.sin(a) * d, r * 0.045, r * 0.085, a + Math.PI / 2, 0, TAU); c.fill();
        }
        c.fillStyle = 'rgba(255,255,255,0.18)';
        def.dots.forEach(([x, y]) => { c.beginPath(); c.arc(x * r * 0.9, y * r * 0.9, r * 0.03, 0, TAU); c.fill(); });
        break;
      case 'portakal': case 'limon': case 'altın': {
        const n = 10;
        for (let i = 0; i < n; i++) {
          const a0 = i / n * TAU + 0.05, a1 = (i + 1) / n * TAU - 0.05;
          const sg = c.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.1);
          sg.addColorStop(0, lighten(def.flesh, 40)); sg.addColorStop(1, def.flesh);
          c.fillStyle = sg; c.beginPath(); c.moveTo(0, 0); c.ellipse(0, 0, r * 1.1 * 0.95, r * 0.92, 0, a0, a1); c.closePath(); c.fill();
        }
        c.strokeStyle = def.rind; c.lineWidth = r * 0.05;
        for (let i = 0; i < n; i++) { const a = i / n * TAU; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r); c.stroke(); }
        c.fillStyle = 'rgba(255,255,255,0.3)';
        def.dots2.forEach(([x, y]) => { c.beginPath(); c.ellipse(x * r, y * r, r * 0.03, r * 0.06, Math.atan2(y, x), 0, TAU); c.fill(); });
        c.fillStyle = def.rind; c.beginPath(); c.arc(0, 0, r * 0.1, 0, TAU); c.fill();
        break;
      }
      case 'elma':
        c.strokeStyle = 'rgba(200,160,80,0.5)'; c.lineWidth = r * 0.03;
        c.beginPath(); for (let i = 0; i <= 5; i++) { const a = i / 5 * TAU - Math.PI / 2; c.lineTo(Math.cos(a) * r * 0.32, Math.sin(a) * r * 0.32); } c.stroke();
        c.fillStyle = '#4a2810';
        for (let i = 0; i < 5; i++) { const a = i / 5 * TAU - Math.PI / 2; c.beginPath(); c.ellipse(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2, r * 0.05, r * 0.09, a + Math.PI / 2, 0, TAU); c.fill(); }
        break;
      case 'nar':
        def.dots2.forEach(([x, y]) => {
          const px = x * r * 0.92, py = y * r * 0.92, rr = r * 0.085;
          const ag = c.createRadialGradient(px - rr * 0.3, py - rr * 0.3, 0, px, py, rr);
          ag.addColorStop(0, '#ff8aa0'); ag.addColorStop(0.5, '#e0183e'); ag.addColorStop(1, '#8a0620');
          c.fillStyle = ag; c.beginPath(); c.arc(px, py, rr, 0, TAU); c.fill();
        });
        break;
      case 'kivi': {
        const kg = c.createRadialGradient(0, 0, 0, 0, 0, r);
        kg.addColorStop(0, '#f4ffd8'); kg.addColorStop(0.3, '#c8f080'); kg.addColorStop(1, '#5aa820');
        c.fillStyle = kg; c.fillRect(-r * 1.5, -r * 1.5, r * 3, r * 3);
        c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 1;
        for (let i = 0; i < 30; i++) { const a = i / 30 * TAU; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.25 * ov, Math.sin(a) * r * 0.25); c.lineTo(Math.cos(a) * r * ov, Math.sin(a) * r); c.stroke(); }
        c.fillStyle = '#111';
        for (let i = 0; i < 34; i++) { const a = i / 34 * TAU, d = r * (0.32 + (i % 3) * 0.04); c.beginPath(); c.ellipse(Math.cos(a) * d * ov, Math.sin(a) * d, r * 0.025, r * 0.05, a + Math.PI / 2, 0, TAU); c.fill(); }
        c.fillStyle = '#fbffe8'; c.beginPath(); c.ellipse(0, 0, r * 0.22 * ov, r * 0.16, 0, 0, TAU); c.fill();
        break;
      }
      case 'şeftali': {
        const pg = c.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 0.7);
        pg.addColorStop(0, 'rgba(220,60,40,0.6)'); pg.addColorStop(1, 'rgba(220,60,40,0)');
        c.fillStyle = pg; c.fillRect(-r, -r, r * 2, r * 2);
        const st = c.createRadialGradient(-r * 0.1, -r * 0.1, 0, 0, 0, r * 0.45);
        st.addColorStop(0, '#b06a3a'); st.addColorStop(1, '#6a3418');
        c.fillStyle = st; c.beginPath(); c.ellipse(0, 0, r * 0.32, r * 0.42, 0.2, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(40,15,5,0.6)'; c.lineWidth = r * 0.03;
        for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(0, 0, r * (0.06 + Math.abs(i) * 0.06), r * 0.38, 0.2, 0, TAU); c.stroke(); }
        break;
      }
      case 'buz':
        c.strokeStyle = 'rgba(80,170,230,0.6)'; c.lineWidth = 2;
        for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); c.stroke(); }
        break;
    }
    c.restore();
  }

  // ---------- Sprite önbelleği ----------
  const sprites = new Map();
  function spriteSize(r) { return Math.ceil(r * 3.2 + 8); }
  function getSprite(def, r, kind) {
    const key = def.name + kind;
    let s = sprites.get(key);
    if (s) return s;
    const size = spriteSize(r), cvs = document.createElement('canvas');
    cvs.width = cvs.height = Math.ceil(size * DPR);
    const c = cvs.getContext('2d');
    c.scale(DPR, DPR); c.translate(size / 2, size / 2);
    if (kind === 'whole') drawWhole(c, def, r);
    else {
      const side = kind === 'top' ? -1 : 1;
      c.save();
      c.beginPath(); c.rect(-size, side > 0 ? 0 : -size, size * 2, size); c.clip();
      drawCut(c, def, r);
      c.restore();
      // kesik yüzeyde parlak çizgi
      const ov = def.shape === 'lemon' ? 1.12 : (def.oval || 1);
      c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-r * ov * 0.9, side * 1); c.lineTo(r * ov * 0.9, side * 1); c.stroke();
    }
    s = { cvs, size };
    sprites.set(key, s);
    return s;
  }
  let shadowSprite = null;
  function buildShadow() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(0.6, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); shadowSprite = c;
  }
  buildShadow();

  // ---------- Arka plan (ahşap tezgah) ----------
  function buildBackground() {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = Math.ceil(W * DPR); bgCanvas.height = Math.ceil(H * DPR);
    const c = bgCanvas.getContext('2d'); c.scale(DPR, DPR);
    const n = Math.max(3, Math.round(W / 120)), pw = W / n;
    for (let i = 0; i < n; i++) {
      const x0 = i * pw, l = 20 + Math.random() * 6, h = 24 + Math.random() * 6;
      const g = c.createLinearGradient(x0, 0, x0 + pw, 0);
      g.addColorStop(0, `hsl(${h},48%,${l - 3}%)`); g.addColorStop(0.5, `hsl(${h},50%,${l + 2}%)`); g.addColorStop(1, `hsl(${h},48%,${l - 4}%)`);
      c.fillStyle = g; c.fillRect(x0, 0, pw + 1, H);
      // damarlar
      for (let k = 0; k < 16; k++) {
        const bx = x0 + Math.random() * pw, amp = 2 + Math.random() * 6, per = 50 + Math.random() * 120, ph = Math.random() * 6;
        c.strokeStyle = Math.random() < 0.6 ? `rgba(0,0,0,${0.08 + Math.random() * 0.1})` : `rgba(255,210,160,${0.03 + Math.random() * 0.04})`;
        c.lineWidth = 0.8 + Math.random() * 1.8;
        c.beginPath();
        for (let y = -10; y <= H + 10; y += 12) { const x = bx + Math.sin(y / per + ph) * amp; y < 0 ? c.moveTo(x, y) : c.lineTo(x, y); }
        c.stroke();
      }
      // budak
      if (Math.random() < 0.7) {
        const kx = x0 + pw * (0.3 + Math.random() * 0.4), ky = Math.random() * H, kr = 6 + Math.random() * 10;
        for (let j = 4; j >= 1; j--) { c.strokeStyle = `rgba(30,12,4,${0.12 * j})`; c.lineWidth = 1.5; c.beginPath(); c.ellipse(kx, ky, kr * j * 0.5, kr * j * 1.1, 0, 0, TAU); c.stroke(); }
        c.fillStyle = 'rgba(30,12,4,0.5)'; c.beginPath(); c.ellipse(kx, ky, kr * 0.4, kr * 0.8, 0, 0, TAU); c.fill();
      }
      // tahta arası boşluk
      c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(x0 - 1.5, 0, 3, H);
      c.fillStyle = 'rgba(255,220,180,0.07)'; c.fillRect(x0 + 1.5, 0, 1, H);
    }
    // üstten sıcak ışık ve vinyet
    const top = c.createRadialGradient(W / 2, H * 0.25, 0, W / 2, H * 0.25, Math.max(W, H) * 0.7);
    top.addColorStop(0, 'rgba(255,190,120,0.16)'); top.addColorStop(1, 'rgba(255,190,120,0)');
    c.fillStyle = top; c.fillRect(0, 0, W, H);
    const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.max(0.9, Math.min(1.6, Math.min(W, H) / 380));
    sprites.clear();
    buildBackground();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Durum ----------
  const MODES = {
    classic: { lives: 3, time: 0, bombs: true },
    timed:   { lives: 0, time: 60, bombs: true },
    zen:     { lives: 0, time: 90, bombs: false },
  };
  let mode = 'classic', state = 'menu';
  let objs = [], halves = [], parts = [], splats = [], texts = [], trail = [], cuts = [];
  let score = 0, lives = 3, timeLeft = 0, elapsed = 0, spawnT = 0, shake = 0, flash = 0, slowmo = 0;
  let stats = { sliced: 0, bestCombo: 0 };
  let pointerDown = false, lastPt = null, swipeHits = [], swipeTimer = 0;
  const pending = [];

  const $ = id => document.getElementById(id);
  const hud = $('hud'), scoreEl = $('score'), bestEl = $('best'), livesEl = $('lives'), timerEl = $('timer');

  function bestKey() { return 'kkb_best_' + mode; }
  let shownScore = 0;
  function updHud() {
    if (score !== shownScore) {
      if (score > shownScore && scoreEl.animate) scoreEl.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 160 });
      shownScore = score;
    }
    scoreEl.textContent = score;
    bestEl.textContent = 'En iyi: ' + store.get(bestKey(), 0);
    if (MODES[mode].lives) {
      livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, MODES[mode].lives - lives));
      livesEl.classList.remove('hidden'); timerEl.classList.add('hidden');
    } else {
      livesEl.classList.add('hidden'); timerEl.classList.remove('hidden');
      timerEl.textContent = Math.ceil(timeLeft);
      timerEl.style.color = timeLeft < 10 ? '#ff5a5a' : '';
    }
  }

  function start(m) {
    mode = m; state = 'play';
    objs = []; halves = []; parts = []; splats = []; texts = []; trail = []; cuts = []; pending.length = 0;
    score = 0; shownScore = 0; lives = MODES[m].lives; timeLeft = MODES[m].time; elapsed = 0; spawnT = 0.5; shake = 0; flash = 0; slowmo = 0;
    stats = { sliced: 0, bestCombo: 0 };
    ['menu', 'over', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
    hud.classList.remove('hidden');
    audio(); updHud();
  }

  function gameOver(title) {
    if (state !== 'play') return;
    state = 'over';
    const best = store.get(bestKey(), 0), isBest = score > best;
    if (isBest) store.set(bestKey(), score);
    $('overTitle').textContent = title;
    $('finalScore').textContent = score;
    $('newBest').classList.toggle('hidden', !isBest);
    $('stats').innerHTML = `Kesilen meyve: <b>${stats.sliced}</b> · En iyi kombo: <b>${stats.bestCombo}</b>`;
    setTimeout(() => { $('over').classList.remove('hidden'); hud.classList.add('hidden'); }, 900);
  }

  // ---------- Fırlatma ----------
  function difficulty() { return Math.min(1, elapsed / 75); }

  function pickOrigin() {
    const r = Math.random();
    return r < 0.5 ? 'bottom' : r < 0.75 ? 'left' : 'right';
  }

  function launch(kind, origin) {
    origin = origin || pickOrigin();
    let def;
    if (kind === 'bomb') def = null;
    else if (kind === 'golden') def = GOLDEN;
    else if (kind === 'freeze') def = FREEZE;
    else def = FRUITS[(Math.random() * FRUITS.length) | 0];
    const r = (def ? def.r : 36) * S;
    const g = 1250 * S;
    const peak = H * (0.12 + Math.random() * 0.33);   // tepe noktası (üstten)
    let x, y = H + r + 6, targetX;
    if (origin === 'left') {
      x = -r * 0.3 + Math.random() * W * 0.06; y = H + r * 0.4 - Math.random() * H * 0.08;
      targetX = W * (0.4 + Math.random() * 0.35);
    } else if (origin === 'right') {
      x = W + r * 0.3 - Math.random() * W * 0.06; y = H + r * 0.4 - Math.random() * H * 0.08;
      targetX = W * (0.25 + Math.random() * 0.35);
    } else {
      x = W * (0.12 + Math.random() * 0.76);
      targetX = W * (0.2 + Math.random() * 0.6);
    }
    const vy = -Math.sqrt(2 * g * (y - peak));
    const tPeak = -vy / g;
    const vx = (targetX - x) / tPeak;
    objs.push({ kind: kind || 'fruit', def, x, y, vx, vy, g, r, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 5, dead: false });
    sfx.launch();
  }

  function later(delay, fn) { pending.push({ t: delay, fn }); }

  function pickKind() {
    const d = difficulty();
    const bombChance = MODES[mode].bombs ? 0.1 + d * 0.12 : 0;
    const r = Math.random();
    if (r < bombChance) return 'bomb';
    if (r < bombChance + 0.035) return 'golden';
    if (r < bombChance + 0.06 && mode !== 'classic') return 'freeze';
    return undefined;
  }

  function spawnWave() {
    const d = difficulty();
    const pattern = Math.random();
    if (pattern < 0.12 + d * 0.06) {
      // meyve yağmuru: iki köşeden sırayla
      const n = 6 + ((Math.random() * 4) | 0);
      for (let i = 0; i < n; i++) later(i * 0.11, () => launch(undefined, i % 2 ? 'left' : 'right'));
      popText(W / 2, H * 0.45, 'MEYVE YAĞMURU!', '#9ef07a', 30);
    } else if (pattern < 0.3) {
      // tek köşeden seri
      const side = Math.random() < 0.5 ? 'left' : 'right', n = 3 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) later(i * 0.14, () => launch(i === n - 1 ? pickKind() : undefined, side));
    } else {
      const n = 2 + ((Math.random() * (2 + d * 4)) | 0);
      for (let i = 0; i < n; i++) later(i * (0.08 + Math.random() * 0.15), () => launch(pickKind()));
    }
  }

  // ---------- Kesme ----------
  function segCircle(ax, ay, bx, by, cx, cy, r) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? ((cx - ax) * dx + (cy - ay) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = ax + dx * t - cx, py = ay + dy * t - cy;
    return px * px + py * py <= r * r;
  }

  function addSplat(x, y, r, c) {
    const pts = [];
    for (let i = 0; i < 14; i++) pts.push(r * (0.55 + Math.random() * 0.35));
    const drops = [];
    for (let i = 0; i < 9; i++) { const a = Math.random() * TAU, d = r * (0.8 + Math.random() * 0.9); drops.push([Math.cos(a) * d, Math.sin(a) * d, r * (0.04 + Math.random() * 0.1)]); }
    const drips = [];
    for (let i = 0; i < 2; i++) drips.push([(Math.random() - 0.5) * r * 0.8, r * (0.5 + Math.random() * 0.5), r * (0.05 + Math.random() * 0.04)]);
    splats.push({ x, y, c, a: 0.5, pts, drops, drips, rot: Math.random() * TAU });
    if (splats.length > 30) splats.shift();
  }

  function sliceObj(o, ang) {
    o.dead = true;
    if (o.kind === 'bomb') { explode(o); return; }
    const def = o.def;
    stats.sliced++;
    score += def.pts;
    sfx.slice();
    if (def.golden) { sfx.special(); popText(o.x, o.y - o.r, '+5 ALTIN!', '#ffd700', 32); for (let i = 0; i < 16; i++) spark(o.x, o.y, '#fff3a0'); }
    if (def.freeze) { sfx.special(); slowmo = 4; popText(o.x, o.y - o.r, 'YAVAŞ ÇEKİM!', '#a8ecff', 30); for (let i = 0; i < 16; i++) spark(o.x, o.y, '#ffffff'); }
    const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
    [1, -1].forEach(side => halves.push({
      def, r: o.r, x: o.x + nx * side * 3, y: o.y + ny * side * 3,
      vx: o.vx * 0.5 + nx * side * 110 * S, vy: Math.min(o.vy * 0.4, 0) + ny * side * 110 * S - 60 * S,
      g: o.g, ang, side, rot: 0, vr: side * (1.5 + Math.random() * 2.5), life: 3,
    }));
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * TAU, sp = (120 + Math.random() * 420) * S;
      parts.push({ type: 'drop', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120 * S, r: (2 + Math.random() * 4.5) * S, c: def.juice, life: 0.6 + Math.random() * 0.5, max: 1.1, g: 1100 * S });
    }
    cuts.push({ x: o.x, y: o.y, ang, len: o.r * 2.6, life: 0.22 });
    addSplat(o.x, o.y, o.r * (1.1 + Math.random() * 0.5), def.juice);
  }

  function spark(x, y, c) {
    const a = Math.random() * TAU, sp = (100 + Math.random() * 300) * S;
    parts.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: (2 + Math.random() * 3) * S, c, life: 0.5 + Math.random() * 0.4, max: 0.9, g: 200 * S });
  }

  function explode(o) {
    sfx.bomb(); shake = 0.55; flash = 1;
    for (let i = 0; i < 50; i++) {
      const a = Math.random() * TAU, sp = (150 + Math.random() * 700) * S;
      parts.push({ type: 'spark', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: (2 + Math.random() * 6) * S,
        c: ['#ffe07a', '#ffb020', '#ff5a1a', '#ffffff'][(Math.random() * 4) | 0], life: 0.5 + Math.random() * 0.7, max: 1.2, g: 300 * S });
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * TAU, sp = (40 + Math.random() * 120) * S;
      parts.push({ type: 'smoke', x: o.x, y: o.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * S, r: (14 + Math.random() * 20) * S, c: '#2a2420', life: 1 + Math.random() * 0.6, max: 1.6, g: -30 * S });
    }
    if (mode === 'classic') {
      lives = 0; updHud();
      popText(o.x, o.y, 'BOMBA!', '#ff4a4a', 46);
      gameOver('Bom! 💥');
    } else {
      score = Math.max(0, score - 10);
      popText(o.x, o.y, '−10', '#ff4a4a', 40);
      updHud();
    }
  }

  function popText(x, y, s, c, size) {
    x = Math.max(size * S * s.length * 0.3, Math.min(W - size * S * s.length * 0.3, x));
    texts.push({ x, y, s, c, size: size * S, life: 1.2, max: 1.2 });
  }

  function endSwipe() {
    const n = swipeHits.length;
    if (n >= 3) {
      score += n;
      stats.bestCombo = Math.max(stats.bestCombo, n);
      const p = swipeHits.reduce((a, o) => ({ x: a.x + o.x / n, y: a.y + o.y / n }), { x: 0, y: 0 });
      popText(p.x, p.y - 40 * S, `${n}x KOMBO! +${n}`, '#ffcf4a', 36);
      sfx.combo(n); shake = Math.max(shake, 0.15);
    } else if (n) stats.bestCombo = Math.max(stats.bestCombo, n);
    swipeHits = [];
    updHud();
  }

  function handleMove(x, y) {
    trail.push({ x, y, t: performance.now() });
    if (!lastPt) { lastPt = { x, y }; return; }
    const dx = x - lastPt.x, dy = y - lastPt.y, dist = Math.hypot(dx, dy);
    if (dist > 4 && state === 'play') {
      const ang = Math.atan2(dy, dx);
      for (const o of objs) {
        if (o.dead) continue;
        if (segCircle(lastPt.x, lastPt.y, x, y, o.x, o.y, o.r * 0.98)) {
          sliceObj(o, ang);
          if (o.kind !== 'bomb') swipeHits.push(o);
          if (state !== 'play') break;
        }
      }
      if (dist > 30 && Math.random() < 0.15) sfx.swoosh();
      updHud();
    }
    lastPt = { x, y };
    swipeTimer = 0.25;
  }

  cv.addEventListener('pointerdown', e => { pointerDown = true; lastPt = null; trail = []; audio(); handleMove(e.clientX, e.clientY); });
  window.addEventListener('pointermove', e => {
    if (!pointerDown) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach(ev => handleMove(ev.clientX, ev.clientY));
  });
  const up = () => { pointerDown = false; lastPt = null; if (swipeHits.length) endSwipe(); };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);

  // ---------- Menü ----------
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => start(b.dataset.mode)));
  $('againBtn').addEventListener('click', () => start(mode));
  $('menuBtn').addEventListener('click', toMenu);
  $('quitBtn').addEventListener('click', toMenu);
  $('pauseBtn').addEventListener('pointerdown', e => { e.stopPropagation(); pause(); });
  $('resumeBtn').addEventListener('click', () => { state = 'play'; $('pauseScreen').classList.add('hidden'); last = performance.now(); });
  function pause() { if (state === 'play') { state = 'paused'; $('pauseScreen').classList.remove('hidden'); } }
  function toMenu() {
    state = 'menu'; objs = []; halves = []; pending.length = 0;
    ['over', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
    hud.classList.add('hidden'); $('menu').classList.remove('hidden');
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- Çizim ----------
  function drawSplats() {
    for (const s of splats) {
      ctx.save(); ctx.globalAlpha = s.a; ctx.fillStyle = s.c; ctx.translate(s.x, s.y);
      const n = s.pts.length, P = s.pts.map((d, i) => { const a = s.rot + i / n * TAU; return [Math.cos(a) * d, Math.sin(a) * d]; });
      ctx.beginPath();
      const m0 = [(P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2]; ctx.moveTo(m0[0], m0[1]);
      for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
      ctx.closePath(); ctx.fill();
      s.drops.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); });
      s.drips.forEach(([x, len, w]) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w / 2, 0, w, len, w / 2) : ctx.rect(x - w / 2, 0, w, len); ctx.fill(); ctx.beginPath(); ctx.arc(x, len, w * 0.8, 0, TAU); ctx.fill(); });
      ctx.restore();
    }
  }

  function drawShadow(x, y, r) {
    const off = 10 * S, w = r * 2.3;
    ctx.drawImage(shadowSprite, x + off - w / 2, y + off * 1.4 - w / 2, w, w);
  }

  function drawBomb(o) {
    const r = o.r, now = performance.now();
    const pulse = 0.5 + 0.5 * Math.sin(now / 90);
    const halo = ctx.createRadialGradient(o.x, o.y, r * 0.8, o.x, o.y, r * 1.8);
    halo.addColorStop(0, `rgba(255,50,40,${0.35 + pulse * 0.25})`); halo.addColorStop(1, 'rgba(255,50,40,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(o.x, o.y, r * 1.8, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.05, 0, 0, r);
    g.addColorStop(0, '#7a7a88'); g.addColorStop(0.45, '#2a2a34'); g.addColorStop(1, '#08080c');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    // kırmızı uyarı bandı
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
    ctx.fillStyle = `rgba(220,30,30,${0.75 + pulse * 0.25})`; ctx.fillRect(-r, -r * 0.14, r * 2, r * 0.28);
    ctx.fillStyle = '#fff'; ctx.font = `900 ${r * 0.26}px ${'Nunito, sans-serif'}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('BOMBA', 0, r * 0.02);
    ctx.restore();
    const sp = ctx.createRadialGradient(-r * 0.4, -r * 0.45, 0, -r * 0.4, -r * 0.45, r * 0.45);
    sp.addColorStop(0, 'rgba(255,255,255,0.7)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    // kapak ve fitil
    ctx.fillStyle = '#9a8660'; ctx.strokeStyle = '#3a2e18'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.rect(-r * 0.22, -r * 1.12, r * 0.44, r * 0.26); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#d8c090'; ctx.lineWidth = r * 0.08; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -r * 1.12); ctx.quadraticCurveTo(r * 0.25, -r * 1.55, r * 0.55, -r * 1.42); ctx.stroke();
    const fx = r * 0.55, fy = -r * 1.42, fr = r * (0.18 + Math.random() * 0.12);
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2);
    fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.3, '#ffe07a'); fg.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx, fy, fr * 2, 0, TAU); ctx.fill();
    ctx.restore();
    if (Math.random() < 0.6) {
      const c = Math.cos(o.rot), s = Math.sin(o.rot), wx = o.x + fx * c - fy * s, wy = o.y + fx * s + fy * c;
      parts.push({ type: 'spark', x: wx, y: wy, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 80, r: 1.5 * S, c: '#ffcf4a', life: 0.3, max: 0.3, g: 0 });
    }
  }

  function drawSpecialGlow(o) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 120);
    const col = o.def.golden ? '255,215,0' : '160,230,255';
    const gl = ctx.createRadialGradient(o.x, o.y, o.r * 0.8, o.x, o.y, o.r * 1.7);
    gl.addColorStop(0, `rgba(${col},${0.35 + 0.3 * pulse})`); gl.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.7, 0, TAU); ctx.fill();
  }

  function drawSprite(sp, x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.drawImage(sp.cvs, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
    ctx.restore();
  }

  function drawTrail() {
    const now = performance.now();
    trail = trail.filter(p => now - p.t < 150);
    if (trail.length < 2) return;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter';
    const passes = [[22, 'rgba(90,170,255,', 0.25], [11, 'rgba(160,215,255,', 0.55], [4, 'rgba(255,255,255,', 1]];
    for (const [w, col, al] of passes) {
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1], b = trail[i], k = i / trail.length;
        ctx.strokeStyle = col + (k * al) + ')';
        ctx.lineWidth = w * k * S + 0.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawParts() {
    for (const p of parts) {
      const k = Math.max(0, p.life / p.max);
      if (p.type === 'smoke') {
        ctx.globalAlpha = k * 0.5; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (2 - k), 0, TAU); ctx.fill();
      } else if (p.type === 'drop') {
        ctx.globalAlpha = Math.min(1, k * 2); ctx.strokeStyle = p.c; ctx.lineCap = 'round'; ctx.lineWidth = p.r * 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.018, p.y - p.vy * 0.018); ctx.stroke();
      } else {
        ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + k * 0.5), 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawCuts() {
    ctx.save(); ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
    for (const c of cuts) {
      const k = c.life / 0.22, dx = Math.cos(c.ang) * c.len / 2, dy = Math.sin(c.ang) * c.len / 2;
      ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 6 * k * S;
      ctx.beginPath(); ctx.moveTo(c.x - dx, c.y - dy); ctx.lineTo(c.x + dx, c.y + dy); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTexts() {
    for (const t of texts) {
      const age = t.max - t.life;
      const sc = age < 0.12 ? 0.4 + (age / 0.12) * 0.9 : age < 0.24 ? 1.3 - ((age - 0.12) / 0.12) * 0.3 : 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, t.life * 2.5);
      ctx.translate(t.x, t.y); ctx.scale(sc, sc);
      ctx.font = `${t.size}px "Lilita One", "Arial Rounded MT Bold", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = t.size * 0.18; ctx.strokeStyle = 'rgba(40,15,0,0.9)'; ctx.strokeText(t.s, 0, 0);
      ctx.fillStyle = t.c; ctx.fillText(t.s, 0, 0);
      ctx.restore();
    }
  }

  // ---------- Döngü ----------
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'paused') { requestAnimationFrame(frame); return; }
    const realDt = dt;
    if (slowmo > 0) { slowmo -= realDt; dt *= 0.4; }

    for (let i = pending.length - 1; i >= 0; i--) {
      pending[i].t -= dt;
      if (pending[i].t <= 0) { const p = pending.splice(i, 1)[0]; if (state === 'play' || state === 'menu') p.fn(); }
    }

    if (state === 'play') {
      elapsed += realDt;
      if (MODES[mode].time) {
        const before = Math.ceil(timeLeft);
        timeLeft -= realDt;
        if (timeLeft <= 0) { timeLeft = 0; updHud(); gameOver('Süre Doldu! ⏰'); }
        else if (Math.ceil(timeLeft) !== before) updHud();
      }
      spawnT -= dt;
      const fruitsOnScreen = objs.filter(o => o.kind !== 'bomb').length;
      if (fruitsOnScreen === 0 && pending.length === 0 && spawnT > 0.35) spawnT = 0.35;
      if (spawnT <= 0) { spawnWave(); spawnT = 1.35 - difficulty() * 0.55 + Math.random() * 0.4; }
      if (swipeTimer > 0) { swipeTimer -= realDt; if (swipeTimer <= 0 && swipeHits.length) endSwipe(); }
    } else if (state === 'menu') {
      spawnT -= dt; if (spawnT <= 0) { launch(undefined); spawnT = 0.7; }
    }

    for (const o of objs) {
      o.vy += o.g * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
      if (!o.dead && o.vy > 0 && o.y > H + o.r + 20) {
        o.dead = true;
        if (state === 'play' && o.kind === 'fruit' && MODES[mode].lives) {
          lives--; sfx.miss(); popText(Math.max(30, Math.min(W - 30, o.x)), H - 50 * S, '✕', '#ff4a4a', 44);
          updHud(); if (lives <= 0) gameOver('Oyun Bitti');
        }
      }
    }
    objs = objs.filter(o => !o.dead);
    for (const h of halves) { h.vy += h.g * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vr * dt; h.life -= dt; }
    halves = halves.filter(h => h.life > 0 && h.y < H + h.r * 2);
    for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const t of texts) { t.y -= 45 * realDt; t.life -= realDt; }
    texts = texts.filter(t => t.life > 0);
    for (const c of cuts) c.life -= realDt;
    cuts = cuts.filter(c => c.life > 0);
    for (const s of splats) s.a = Math.max(0, s.a - realDt * 0.04);
    splats = splats.filter(s => s.a > 0);

    ctx.save();
    if (shake > 0) { shake -= realDt; const m = 16 * shake; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    drawSplats();
    for (const h of halves) drawShadow(h.x, h.y, h.r * 0.8);
    for (const o of objs) drawShadow(o.x, o.y, o.r);
    for (const h of halves) drawSprite(getSprite(h.def, h.r, h.side > 0 ? 'bottom' : 'top'), h.x, h.y, h.ang + h.rot);
    for (const o of objs) {
      if (o.kind === 'bomb') { drawBomb(o); continue; }
      if (o.def.golden || o.def.freeze) drawSpecialGlow(o);
      drawSprite(getSprite(o.def, o.r, 'whole'), o.x, o.y, o.rot);
    }
    drawParts();
    drawCuts();
    drawTrail();
    drawTexts();
    ctx.restore();
    if (slowmo > 0) { ctx.fillStyle = `rgba(150,220,255,${Math.min(0.2, slowmo * 0.1)})`; ctx.fillRect(0, 0, W, H); }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); flash -= realDt * 2.5; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
