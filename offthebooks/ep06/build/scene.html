<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Off The Books — frame renderer. render(t) draws the frame at t seconds.
// window.T = timings.json (lines with word times, shot spans). The episode file defines SHOTS, HUD and SFX.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = {
  navy: '#0E1424', navy2: '#18213A', gold: '#F5C518', gold2: '#FFE07A', paper: '#F3EEDF', rule: '#A9C2A4',
  margin: '#D9604F', ink: '#1C1B19', ink2: '#5B5850', red: '#E5484D', white: '#FFFFFF', grey: '#9AA3B2',
};
const SANS = 'Inter, sans-serif', MONO = 'JBM, monospace';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const a = 1.70158, b = a + 1; return 1 + b * Math.pow(k - 1, 3) + a * Math.pow(k - 1, 2); };
const pop = (t, s, d = .35) => { const k = prog(t, s, d); return k <= 0 ? 0 : easeBack(k); };
const usd = v => '$' + Math.round(v).toLocaleString('en-US');
function rnd(seed) { const x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); }
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function withT(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s); fn(); ctx.restore(); }
function text(str, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 900} ${size}px ${o.font || SANS}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur || 24; ctx.shadowOffsetY = o.shadowY || 4; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || size * .16; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}
function mono(str, x, y, size, color, o = {}) { return text(str, x, y, size, color, { font: MONO, weight: o.weight || 500, spacing: o.spacing ?? size * .12, ...o }); }

// ---------- timing ----------
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');
let SHOT_LIST = null;
function shotList() {
  if (!SHOT_LIST) SHOT_LIST = Object.entries(T.shots).map(([k, v]) => ({ id: k, s: v[0], e: v[1] })).sort((a, b) => a.s - b.s);
  return SHOT_LIST;
}
// start time of the nth occurrence of a word inside a shot (search across all lines when shot is null)
function at(shot, word, nth = 0) {
  const key = norm(String(word));
  for (const l of T.lines) {
    if (shot && l.shot !== shot) continue;
    for (const w of l.words) if (norm(w.w) === key && nth-- === 0) return w.s;
  }
  throw new Error(`word "${word}" not found in shot ${shot}`);
}
const S = id => T.shots[id][0];
const E = id => T.shots[id][1];

// ---------- images ----------
const IMGS = {};
function loadImages(list) {
  for (const n of list) { const im = new Image(); im.src = `img/${n}.jpg`; IMGS[n] = im; document.body.appendChild(Object.assign(im, { style: 'display:none' })); }
}
// draw an image to cover the frame. cam = [cx, cy, zoom] (cx, cy in 0..1 of the image)
function drawImg(name, cam, o = {}) {
  const im = IMGS[name];
  const [cx, cy, z] = cam;
  const s = Math.max(W / im.width, H / im.height) * z;
  const dw = im.width * s, dh = im.height * s;
  let x = W / 2 - cx * dw, y = H / 2 - cy * dh;
  x = clamp(x, W - dw, 0); y = clamp(y, H - dh, 0);
  ctx.save();
  if (o.filter) ctx.filter = o.filter;
  ctx.drawImage(im, x + (o.dx || 0), y + (o.dy || 0), dw, dh);
  ctx.restore();
}
const camAt = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
// a shot made of quick framings: frames = [[img, cx, cy, zoom], ...] split evenly over the shot.
// Every framing is a hard cut with a slow push-in, so no picture holds for more than ~2 s.
function beats(frames, o = {}) {
  return {
    img: true, vig: o.vig,
    draw(t, lt, dur) {
      // o.cuts(): absolute start times of frames 2..n (e.g. word times); otherwise split the shot evenly
      const n = frames.length, t0 = t - lt;
      const starts = o.cuts ? [0, ...o.cuts().map(c => c - t0)] : frames.map((_, j) => j * dur / n);
      let i = 0;
      while (i + 1 < n && lt >= starts[i + 1]) i++;
      const seg = (i + 1 < n ? starts[i + 1] : dur) - starts[i], k = clamp((lt - starts[i]) / seg);
      const [name, cx, cy, z, f = {}] = frames[i];
      const dir = i % 2 ? -1 : 1;
      const ls = lt - starts[i];  // time since this framing started
      const pop = lerp(1.035, 1, easeOut(clamp(ls / .15)));
      let dx = 0, dy = 0;
      if (o.shake) { const s = o.shake(t); dx = Math.sin(t * 71) * 16 * s; dy = Math.cos(t * 53) * 12 * s; }
      // f.tr 'shake' / f.shake: a hit on the cut
      const hitK = (f.tr === 'shake' ? 1 : f.shake || 0) * clamp(1 - ls / .45);
      if (hitK) { dx += Math.sin(t * 83) * 28 * hitK; dy += Math.cos(t * 61) * 22 * hitK; }
      // o.push: a slow accelerating dolly-in for tense moments, with the edges closing in (depth)
      const push = o.push ? o.push * Math.pow(k, 1.4) : .045 * k;
      // per-framing camera move (f.move): in / out / left / right / up / down / crash (fast punch-in that settles)
      let zz = z * pop * (1 + push), ccx = cx + dir * .015 * k, ccy = cy;
      const mv = f.move;
      if (mv === 'out') zz = z * pop * (1.16 - .14 * easeOut(k));
      if (mv === 'left' || mv === 'right') ccx = cx + (mv === 'left' ? -1 : 1) * (.07 * easeInOut(k) - .035);
      if (mv === 'up' || mv === 'down') ccy = cy + (mv === 'up' ? -1 : 1) * (.08 * easeInOut(k) - .04);
      if (mv === 'crash') zz = z * (1 + .32 * easeOut(clamp(ls / .22)) + .04 * k);
      if (f.tr === 'crash') zz *= lerp(1.45, 1, easeOut(clamp(ls / .2)));
      if (f.fx === 'pulse') zz *= 1 + .025 * Math.pow(Math.max(0, Math.sin(t * Math.PI / .8)), 8);
      // rotation: f.rot = dutch angle in degrees, f.fx 'sway' = ship rolling
      let rot = (f.rot || 0) * Math.PI / 180;
      if (f.fx === 'sway') { rot += Math.sin(t * 1.4) * .028; dy += Math.sin(t * 1.4 + 1) * 14; }
      if (f.tr === 'tilt') rot += lerp(.12, 0, easeOut(clamp(ls / .35)));
      if (rot) zz *= 1 + Math.abs(rot) * 1.1;
      // whip: the new picture slides in fast with a motion smear
      const wk = f.tr === 'whip' ? 1 - easeOut(clamp(ls / .22)) : 0;
      ctx.save();
      if (rot) { ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2); }
      if (wk > 0) {
        drawImg(name, [ccx, ccy, zz * 1.04], { dx, dy, filter: 'blur(6px)' });
        for (let j = 4; j >= 0; j--) { ctx.globalAlpha = j ? .22 : 1; drawImg(name, [ccx, ccy, zz], { dx: dx + (wk * W * .55 + j * 40 * wk) * (dir > 0 ? 1 : -1), dy }); }
        ctx.globalAlpha = 1;
      } else drawImg(name, [ccx, ccy, zz], { dx, dy });
      // glitch: RGB-split copies for a beat
      if (f.tr === 'glitch' && ls < .28) {
        ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .45;
        drawImg(name, [ccx, ccy, zz], { dx: dx + 22, dy, filter: 'hue-rotate(120deg)' });
        drawImg(name, [ccx, ccy, zz], { dx: dx - 22, dy: dy + 6, filter: 'hue-rotate(240deg)' });
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      }
      ctx.restore();
      // lights: f.fx 'flicker' = failing bulbs
      if (f.fx === 'flicker') {
        const n = rnd(Math.floor(t * 18)), dark = n > .82 ? .55 : n > .7 ? .25 : 0;
        if (dark) { ctx.fillStyle = `rgba(2,3,8,${dark})`; ctx.fillRect(0, 0, W, H); }
      }
      // cut flashes: white / red / dark dip
      if (f.tr === 'flash' || f.tr === 'red' || f.tr === 'dip') {
        const a = clamp(1 - ls / (f.tr === 'dip' ? .16 : .2));
        if (a > 0) { ctx.fillStyle = f.tr === 'flash' ? `rgba(255,255,255,${a * .85})` : f.tr === 'red' ? `rgba(200,20,30,${a * .6})` : `rgba(0,0,0,${a * .8})`; ctx.fillRect(0, 0, W, H); }
      }
      if (f.tint) {
        ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = f.tint[1]; ctx.fillStyle = f.tint[0]; ctx.fillRect(0, 0, W, H); ctx.restore();
      }
      if (o.tint) {  // per-scene colour mood: [css colour, strength]
        ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = o.tint[1]; ctx.fillStyle = o.tint[0]; ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = o.tint[1] * .35; ctx.fillRect(0, 0, W, H); ctx.restore();
      }
      if (o.push) {
        const g = ctx.createRadialGradient(W / 2, H * .45, H * (.42 - .14 * k), W / 2, H * .45, H * .8);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(3,4,10,${.15 + .45 * k})`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      if (o.after) o.after(t, lt, dur);
    },
  };
}
function vignette(a = .55) {
  const g = ctx.createRadialGradient(W / 2, H * .45, H * .25, W / 2, H * .5, H * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(4,6,14,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // bottom fade so captions and the Shorts UI read well
  const b = ctx.createLinearGradient(0, H * .62, 0, H);
  b.addColorStop(0, 'rgba(4,6,14,0)'); b.addColorStop(1, 'rgba(4,6,14,.55)');
  ctx.fillStyle = b; ctx.fillRect(0, H * .62, W, H * .38);
}
// film grain, cached tiles
const GRAIN = [];
function grain(t, a = .06) {
  if (!GRAIN.length) for (let k = 0; k < 4; k++) {
    const g = document.createElement('canvas'); g.width = 256; g.height = 256;
    const gx = g.getContext('2d'), d = gx.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = rnd(i + k * 7919) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    gx.putImageData(d, 0, 0); GRAIN.push(ctx.createPattern(g, 'repeat'));
  }
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = GRAIN[Math.floor(t * 24) % 4]; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------- ledger paper (info screens) ----------
function ledger(header) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.rule; ctx.lineWidth = 2; ctx.globalAlpha = .55;
  for (let y = 236; y < H; y += 68) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = .7; ctx.strokeStyle = C.margin; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(110, H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(118, 0); ctx.lineTo(118, H); ctx.stroke();
  ctx.globalAlpha = 1;
  // paper tone variation
  const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, H * .75);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(120,100,60,.18)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (header) mono(header, W / 2, 330, 30, C.ink2, { spacing: 6 });
}
// rubber stamp: k = pop progress (0..1+)
function stamp(str, x, y, size, color, k, rot = -.07) {
  if (k <= 0) return;
  const s = lerp(1.8, 1, clamp(k)) * (k > 1 ? 1 : 1);
  withT(x, y, s, rot, () => {
    ctx.globalAlpha = clamp(k * 2);
    ctx.font = `900 ${size}px ${SANS}`;
    const w = ctx.measureText(str).width + size * .8, h = size * 1.35;
    rr(-w / 2, -h / 2, w, h, size * .16); ctx.lineWidth = size * .09; ctx.strokeStyle = color; ctx.stroke();
    text(str, 0, size * .04, size, color);
  });
}
// count from a to b over [s, s+d]
const count = (t, s, d, a, b, ease = easeInOut) => lerp(a, b, ease(prog(t, s, d)));

// ---------- HUD ----------
function hudBox(x, w, label, value, o = {}) {
  const y = 150, h = 112;
  ctx.save();
  if (o.flash) { ctx.shadowColor = o.flashColor || C.gold; ctx.shadowBlur = 40 * o.flash; }
  rr(x, y, w, h, 16); ctx.fillStyle = 'rgba(8,11,22,.78)'; ctx.fill();
  ctx.shadowBlur = 0;
  const fc = o.flashColor === C.red ? '229,72,77' : '245,197,24';
  ctx.lineWidth = o.flash ? 2 + 3 * o.flash : 2; ctx.strokeStyle = o.flash ? `rgba(${fc},${.4 + .6 * o.flash})` : 'rgba(255,255,255,.12)'; ctx.stroke();
  mono(label, x + 22, y + 32, 21, C.grey, { align: 'left', spacing: 3 });
  text(value, x + 22, y + 76, 44, o.color || C.white, { align: 'left', weight: 800 });
  if (o.bar !== undefined) {
    rr(x + 22, y + h - 14, w - 44, 6, 3); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill();
    if (o.bar > 0) { rr(x + 22, y + h - 14, (w - 44) * o.bar, 6, 3); ctx.fillStyle = C.gold; ctx.fill(); }
  }
  ctx.restore();
}
function drawHud(h, k) {
  if (!h || k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * -30);
  hudBox(40, 400, 'CASH', usd(h.cash), { flash: h.cashFlash, flashColor: C.red, color: h.cashFlash ? '#FF8A8A' : C.white });
  hudBox(456, 250, 'SPENT', usd(h.spent));
  hudBox(722, 318, 'EXPOSED', Math.round(h.exposed) + '%', { color: h.expRed && h.expFlash > .3 ? C.red : h.exposed > 0 ? C.gold : C.white, bar: h.exposed / 100, flash: h.expFlash, flashColor: h.expRed ? C.red : C.gold });
  if (h.label) {
    ctx.font = `700 24px ${MONO}`;
    const w = ctx.measureText(h.label).width + 40;
    rr(40, 280, w + h.label.length * 2.4, 46, 8); ctx.fillStyle = C.gold; ctx.fill();
    mono(h.label, 60, 304, 24, C.navy, { align: 'left', weight: 700, spacing: 2.4 });
  }
  ctx.restore();
}

// ---------- captions (karaoke) ----------
let CHUNKS = null;
function buildChunks() {
  CHUNKS = [];
  for (const line of T.lines) {
    if (line.card || NO_CAPTION.has(line.shot)) continue;
    let cur = [];
    const flush = () => { if (cur.length) CHUNKS.push({ words: cur }); cur = []; };
    for (const w of line.words) { cur.push(w); if (/[.,?!:…]$/.test(w.w) || cur.length >= 3) flush(); }
    flush();
  }
  for (let i = 0; i < CHUNKS.length; i++) {
    const c = CHUNKS[i], nx = CHUNKS[i + 1];
    c.s = c.words[0].s - .05;
    const last = c.words[c.words.length - 1].e;
    c.e = nx ? Math.min(nx.words[0].s - .05, last + .45) : last + .6;
  }
}
const isNum = s => /[$%0-9]/.test(s);
function captions(t) {
  if (!CHUNKS) buildChunks();
  const c = CHUNKS.find(c => t >= c.s && t < c.e);
  if (!c) return;
  const y = 1290;
  let size = 76;
  ctx.save();
  ctx.font = `900 ${size}px ${SANS}`;
  const sp = size * .28;
  const ws = c.words.map(w => w.w);
  let total = ws.reduce((a, w) => a + ctx.measureText(w).width, 0) + sp * (ws.length - 1);
  if (total > 940) { size *= 940 / total; ctx.font = `900 ${size}px ${SANS}`; total = 940; }
  const k = easeOut(prog(t, c.s, .12));
  let x = W / 2 - total / 2;
  c.words.forEach((w, i) => {
    const str = ws[i], ww = ctx.measureText(str).width;
    const said = t >= w.s;
    const col = said ? (isNum(str) ? C.gold : C.white) : 'rgba(205,210,220,.55)';
    text(str, x + ww / 2, y + (1 - k) * 14, size, col, { shadow: 'rgba(0,0,0,.85)', shadowBlur: 18, shadowY: 4, alpha: k });
    x += ww + sp;
  });
  ctx.restore();
}

// ---------- captions (one big word at a time) ----------
let WORDS = null;
function wordCaption(t) {
  if (!WORDS) {
    WORDS = [];
    for (const l of T.lines) if (!l.card && !NO_CAPTION.has(l.shot)) for (const w of l.words) WORDS.push(w);
    WORDS.forEach((w, i) => { const nx = WORDS[i + 1]; w.until = nx ? Math.min(nx.s, w.e + .35) : w.e + .5; });
  }
  const w = WORDS.find(w => t >= w.s - .03 && t < w.until);
  if (!w) return;
  const str = w.w.replace(/[,.:;!?…"]+$/g, '').replace(/^"/, '').toUpperCase();
  const inner = typeof INNER !== 'undefined' && T.lines.some(l => l.shot && INNER.has(l.shot) && l.words.includes(w));
  if (!str) return;
  let size = 84;
  ctx.save();
  ctx.font = `900 ${size}px ${SANS}`;
  const tw = ctx.measureText(str).width;
  if (tw > 820) size *= 820 / tw;
  const k = easeOut(prog(t, w.s - .03, .09));
  const hot = isNum(str) || (typeof KEY_WORDS !== 'undefined' && KEY_WORDS.has(str.replace(/[^A-Z]/g, '')));
  withT(W / 2, 1500, lerp(1.12, 1, k), 0, () => text(inner ? `(${str.toLowerCase()})` : str, 0, 0, size, inner ? '#A9C4EE' : hot ? C.gold : C.white,
    { stroke: '#05070F', strokeW: 12, shadow: 'rgba(0,0,0,.8)', shadowBlur: 24, shadowY: 6 }));
  ctx.restore();
}

// Off The Books — Part 6 "Sunday" (CALL).
// Rules from the Part 2 YouTube / Titanic P1 retention data: no recap in the first 10 s (the new event is the first sentence),
// 45 s, open loop (Monday 9 AM invite) BEFORE the vote, CTA last and 2 s, one share line, varied cuts per frame.
// ---- shared overlay widgets (Part 4+): in-story UI that keeps the screen moving without new pictures ----
const typed = (str, t, t0, cps = 28) => str.slice(0, Math.floor(clamp((t - t0) * cps, 0, str.length)));
const fadeIn = (t, t0, t1 = Infinity, d = .2) => easeOut(prog(t, t0, d)) * clamp((t1 - t) / .2);
function uiBox(x, y, w, h, o = {}) {
  rr(x, y, w, h, 18); ctx.fillStyle = o.bg || 'rgba(8,11,22,.9)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = o.border || 'rgba(245,197,24,.8)'; ctx.stroke();
}
// small tag + big value (value may be a function of t; o.type types it out)
function infoBox(t, t0, t1, y, tag, value, o = {}) {
  const k = fadeIn(t, t0, t1);
  if (k <= 0) return;
  const w = o.w || 760, h = o.h || 150, x = (W - w) / 2;
  ctx.save(); ctx.globalAlpha = k;
  uiBox(x, y, w, h, o);
  mono(tag, W / 2, y + 38, 24, o.tagCol || C.gold, { weight: 700, spacing: 4 });
  if (Array.isArray(value)) segText(value, W / 2, y + 100, o.size || 64, o.type ? Math.floor((t - t0 - .1) * (o.cps || 24)) : 1e9, 'center');
  else {
    const v = typeof value === 'function' ? value(t) : o.type ? typed(value, t, t0 + .1, o.cps || 24) : value;
    text(v, W / 2, y + 100, o.size || 64, o.col || C.white);
  }
  if (o.sub) mono(o.sub, W / 2, y + h - 16, 20, C.grey, { spacing: 2 });
  ctx.restore();
}
// "THE VOTES ARE IN": bars race from 0 to their share, then the winner badge
function voteRace(t, t0, rows, badge, badgeT, t1 = Infinity) {
  const k = fadeIn(t, t0, t1);
  if (k <= 0) return;
  const x = 80, w = W - 160, y = 330, h = 110 + rows.length * 96;
  ctx.save(); ctx.globalAlpha = k;
  uiBox(x, y, w, h);
  mono('THE VOTES ARE IN', x + 36, y + 44, 24, C.gold, { align: 'left', weight: 700, spacing: 4 });
  rows.forEach(([label, pct, note], i) => {

  add('hit', 0, .7); add('money_count', 0, .7, .4); add('stamp', H_('nobody'), .7);
  add('ring', H_('phone') - .15, .45, .8); add('beep', H_('phone') + .1, .5);
  add('glitch', H_('someone'), .4); add('thump', H_('pretending'), .6);
  add('static', S('rep'), .25); add('click', S('rep') + .05, .4);
  add('typewriter', S('lock') + .05, .4, .6); add('fill', S('lock') + .2, .55, .7);
  add('paper', at('fact', 'nobody') - .1, .4);
  add('knock', at('rule', 'rule'), .6); add('fill', at('rule', 'lock'), .45, .5);
  add('glitch', S('dead'), .6); add('buzz', S('dead') + .1, .6, .6); add('hit', at('dead', 'lost'), .7);
  add('silence', S('callback') - .1, .4); add('typewriter', at('callback', 'number'), .45, 1.2);
  add('drone', S('grant'), .5, 4); add('stamp', at('grant', 'its'), .8); add('hit', at('grant', 'its'), .8);
  add('heartbeat', S('inner'), .55, 3); add('thud', at('inner', 'sold'), .6);
  add('click', S('share') + .1, .5);
  add('ring', at('monday', 'calendar') - .05, .3, .5); add('beep', at('monday', 'calendar') + .2, .5);
  add('tick', at('monday', 'monday'), .5); add('thump', at('monday', 'grant'), .5); add('thump', at('monday', 'one'), .7);
  add('thump', S('choice') + .1, .7); add('click', S('choice') + .35, .5); add('click', S('choice') + .65, .5);
  add('click', at('cta', 'follow') - .1, .8);
  add('hit', S('end'), .7);
  return ev.sort((a, b) => a.t - b.t);
}


// ---------- main ----------
function shotAt(t) {
  const L = shotList();
  let cur = L[0];
  for (const s of L) if (t >= s.s) cur = s;
  return cur;
}
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.clearRect(0, 0, W, H);
  const sh = shotAt(t);
  const L = shotList(), i = L.indexOf(sh);
  const end = i + 1 < L.length ? L[i + 1].s : T.total;
  const lt = t - sh.s, dur = end - sh.s;
  const def = SHOTS[sh.id];
  // entry punch-in
  const pk = easeOut(prog(lt, 0, .3));
  ctx.save();
  const z = def.noPunch ? 1 : lerp(1.035, 1, pk);
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  def.draw(t, lt, dur);
  ctx.restore();
  if (def.img) { vignette(def.vig ?? .5); grain(t, .07); } else grain(t, .045);
  const h = HUD(t, sh.id);
  if (h) drawHud(h, h.k ?? 1);
  if (!NO_CAPTION.has(sh.id)) (typeof CAPTION_MODE !== 'undefined' && CAPTION_MODE === 'word' ? wordCaption(t) : captions(t));
  if (window.OVERLAY_EXTRA) window.OVERLAY_EXTRA(t, sh.id);
};
window.events = () => SFX();
</script>
