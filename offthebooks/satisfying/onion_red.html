function exactKnife(r, t) {

  }

    const y = k === 0 ? yCut(r, 1) : lerp(yCut(r, k), yCut(r, Math.min(r.c, k + 1)), back);
    return { q: QC, x: B_X, y, z: ph < .45 && k > 0 ? lerp(C_Z1, C_Z0, back) : lerp(C_Z0, C_Z1, push), dir: 'c' };
  }
  if (t < r.p2) {                                                  // pull out the back, stand up for the crosswise cuts
    const u = easeInOut((t - r.p3e) / (r.p2 - r.p3e)), q = QC.clone().slerp(qb, u);

    return { q: qb, x: B_X, y: k === 0 ? LIFT * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: lerp(from, to, easeInOut((ph - .25) / .5)), dir: 'b' };

function placeKnife(r, t, sx) {
  const k = knifeAt(r, t);

}

// ---------- camera: fixed, like the reference (no push-in) ----------
function placeCamera() { cam.position.copy(CAM); cam.lookAt(LOOK); }

const fmt = n => n.toLocaleString('en-US');
const roundAt = t => ROUNDS.find(q => t < q.t1) || ROUNDS[ROUNDS.length - 1];
// CUBES: the pieces the crosswise pass has freed (0 until it starts, like the reference); "≈" once it is very large
function cubesAt(r, c) {
  if (c.kb === 0) return 0;
  if (!r.rows) prepCount(r);

}
const fmtC = n => n >= 100000 ? '≈' + fmt(Math.round(n / 1000) * 1000) : fmt(n);
window.renderAt = t => {
  t = Math.min(t, DURATION - 1e-6);
  const r = roundAt(t);
  const sx = -slabOffsets(r, t)[0] / 2;                             // keep the opened slices centred on the board
  const fresh = !r.cells;
  const c = drawMelon(sets[0], r, t, sx);                           // hard cut between rounds: one at a time
  if (fresh && r.cells) { r3.render(scene, cam); drawMelon(sets[0], r, t, sx); }   // the frame that prepared the cubes drew stale ones: draw it again
  placeKnife(r, t, sx); placeCamera();
  c.cubes = cubesAt(r, c);
  document.getElementById('cuts').textContent = fmt(c.ka + c.kc + c.kb);
  document.getElementById('pieces').textContent = fmtC(c.cubes);
  r3.render(scene, cam);
  return c;
};
window.kitchenReady = true; window._R = ROUNDS; window._knifeAt = knifeAt;
window.ready = true;
