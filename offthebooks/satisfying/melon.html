  const handle = new THREE.Mesh(new RoundedBoxGeometry(1.95, .44, .2, 4, .09), hm); handle.position.set(-1.1, .66, 0); handle.castShadow = !t; g.add(handle);
  for (const x of [-.5, -1.1, -1.7]) { const rv = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .22, 16), steel); rv.rotation.x = Math.PI / 2; rv.position.set(x, .66, 0); g.add(rv); }

}
const knife = makeKnife(1), ghosts = [.3, .2, .13, .08].map(makeKnife);
const QA = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -Math.PI / 2, 0));
const QB = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));
const TILT = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), .03);
function pose(g, q, x, y, z) { g.quaternion.copy(q).multiply(TILT); g.position.set(x, y, z); }
const LIFT = 2 * RY + .45, REST_Y = 2 * RY + .9;
const xCut = (r, k) => -RX + 2 * RX / (r.a + 1) * k;
const zCut = (r, k) => RZ - 2 * RZ / (r.b + 1) * k;             // crosswise cuts go front to back: the falling pieces face the camera
const A_Z = -RZ - .5, B_X = RX + .55;
function knifeAt(r, t) {
  const qa = QA, qb = QB;
  if (t < r.p1) return { q: qa, x: xCut(r, 1), y: REST_Y, z: A_Z };
  if (t < r.p1e) {
    const x = countAt(t, r.p1, r.p1e, r.a, r.pow), k = Math.floor(x), ph = x - k;
    const from = xCut(r, Math.max(1, k)), to = xCut(r, Math.min(r.a, k + 1));
    return { q: qa, x: lerp(from, to, easeInOut((ph - .25) / .5)), y: k === 0 ? REST_Y * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: A_Z, dir: 'a' };
  }
  if (t < r.p2) {
    const u = easeInOut((t - r.p1e) / TURN), q = qa.clone().slerp(qb, u);
    return { q, x: lerp(xCut(r, r.a), B_X, u), y: LIFT * u + .6 * Math.sin(Math.PI * u), z: lerp(A_Z, zCut(r, 1), u) };
  }
  if (t < r.p2e) {
    const x = countAt(t, r.p2, r.p2e, r.b, r.pow), k = Math.floor(x), ph = x - k;
    const from = zCut(r, Math.max(1, k)), to = zCut(r, Math.min(r.b, k + 1));
    return { q: qb, x: B_X, y: k === 0 ? LIFT * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: lerp(from, to, easeInOut((ph - .25) / .5)), dir: 'b' };
  }
  const u = easeInOut((t - r.p2e) / .45), q = qb.clone().slerp(qa, u);
  return { q, x: lerp(B_X, xCut(ROUNDS[(r.i + 1) % ROUNDS.length], 1), u), y: lerp(0, REST_Y, u), z: lerp(zCut(r, r.b), A_Z, u) };

function placeKnife(r, t) {
  const k = knifeAt(r, t);

  const win = k.dir === 'a' ? [r.p1, r.p1e, r.a] : k.dir === 'b' ? [r.p2, r.p2e, r.b] : null;
  const rate = win ? win[2] * r.pow * Math.pow(clamp((t - win[0]) / (win[1] - win[0]), .03, 1), r.pow - 1) / (win[1] - win[0]) : 0;
  const fast = rate > 9;

}

// ---------- camera: a slow push-in while a round is cut, back to the start while the next melon slides in ----------
const PUSH = .16;
function placeCamera(r, t) {
  let z = easeInOut((t - r.p1) / (r.p2e - r.p1)) * PUSH;
  if (t >= r.slide) z *= 1 - easeInOut((t - r.slide) / SLIDE);
  cam.position.copy(LOOK).addScaledVector(CAM.clone().sub(LOOK), 1 - z);

}

const fmt = n => n.toLocaleString('en-US');
const roundAt = t => ROUNDS.find(q => t < q.t1) || ROUNDS[ROUNDS.length - 1];
window.renderAt = t => {
  t = Math.min(t, DURATION - 1e-6);
  const r = roundAt(t), nxt = ROUNDS[(r.i + 1) % ROUNDS.length];
  let c;
  if (t >= r.slide) {
    const u = (t - r.slide) / SLIDE;
    c = drawMelon(sets[0], r, t, -easeIn(u) * 12);
    drawMelon(sets[1], nxt, nxt.t0 - 1, (1 - easeOut(u)) * 12);

  document.getElementById('cuts').textContent = fresh ? '0' : fmt(c.ka + c.kb);
  document.getElementById('pieces').textContent = fresh ? '1' : fmt(pieceCount(r, c.ka, c.kb));
  r3.render(scene, cam);
  return c;
};
window.kitchenReady = true;
window.ready = true;
