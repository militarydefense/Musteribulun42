const yCut = (r, k) => 2 * RY - 2 * RY / (r.c + 1) * k;         // horizontal cuts go top to bottom
const zCut = (r, k) => RZ - 2 * RZ / (r.b + 1) * k;             // crosswise cuts go front to back: the falling pieces face the camera
const A_Z = -RZ - .5, B_X = RX + .55;
// horizontal: the knife lies flat, edge facing the back, handle on the right; it slides in from the front and the cut
// is done when the edge leaves the back of the melon
const QC = QB.clone().premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2));
const C_Z0 = RZ + .2, C_Z1 = -RZ - .15;
function knifeAt(r, t) {
  const qa = QA, qb = QB;
  if (t < r.p1) return { q: qa, x: xCut(r, 1), y: REST_Y, z: A_Z };
  if (t < r.p1e) {
    const x = countAt(t, r.p1, r.p1e, r.a, r.pow), k = Math.floor(x), ph = x - k;
    const from = xCut(r, Math.max(1, k)), to = xCut(r, Math.min(r.a, k + 1));
    return { q: qa, x: lerp(from, to, easeInOut((ph - .25) / .5)), y: k === 0 ? REST_Y * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: A_Z, dir: 'a' };
  }
  if (t < r.p3) {                                                  // lift out, swing round and lie flat in front of the melon
    const u = easeInOut((t - r.p1e) / (r.p3 - r.p1e)), q = qa.clone().slerp(QC, u);
    return { q, x: lerp(xCut(r, r.a), B_X, u), y: lerp(0, yCut(r, 1), u) + (2 * RY + .6) * Math.sin(Math.PI * u), z: lerp(A_Z, C_Z0, u) };
  }
  if (t < r.p3e) {
    const x = countAt(t, r.p3, r.p3e, r.c, r.pow), k = Math.floor(x), ph = x - k;
    const back = k === 0 ? 1 : easeInOut(ph / .35), push = easeInOut((ph - .35) / .65);
    const y = k === 0 ? yCut(r, 1) : lerp(yCut(r, k), yCut(r, Math.min(r.c, k + 1)), back);
    return { q: QC, x: B_X, y, z: ph < .35 && k > 0 ? lerp(C_Z1, C_Z0, back) : lerp(C_Z0, C_Z1, push), dir: 'c' };
  }
  if (t < r.p2) {                                                  // pull out the back, stand up for the crosswise cuts
    const u = easeInOut((t - r.p3e) / (r.p2 - r.p3e)), q = QC.clone().slerp(qb, u);
    return { q, x: B_X, y: lerp(yCut(r, r.c), LIFT, u) + (2 * RY - yCut(r, r.c) + .4) * Math.sin(Math.PI * u), z: lerp(C_Z1, zCut(r, 1), u) };
  }
  if (t < r.p2e) {
    const x = countAt(t, r.p2, r.p2e, r.b, r.pow), k = Math.floor(x), ph = x - k;
    const from = zCut(r, Math.max(1, k)), to = zCut(r, Math.min(r.b, k + 1));
    return { q: qb, x: B_X, y: k === 0 ? LIFT * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: lerp(from, to, easeInOut((ph - .25) / .5)), dir: 'b' };
  }
  // after the last cut the knife lifts high and back so the pile stays in view, then settles at the rest pose during the slide
  const u = easeInOut((t - r.p2e) / .45), q = qb.clone().slerp(qa, u), d = 1 - easeInOut((t - r.slide) / SLIDE);
  return { q, x: lerp(B_X, xCut(ROUNDS[(r.i + 1) % ROUNDS.length], 1), u), y: lerp(0, REST_Y + 2.2 * d, u), z: lerp(zCut(r, r.b), A_Z - 1.4 * d, u) };
}
function placeKnife(r, t) {
  const k = knifeAt(r, t);
  pose(knife, k.q, k.x, k.y, k.z);
  const win = { a: [r.p1, r.p1e, r.a], c: [r.p3, r.p3e, r.c], b: [r.p2, r.p2e, r.b] }[k.dir];
  const rate = win ? win[2] * r.pow * Math.pow(clamp((t - win[0]) / (win[1] - win[0]), .03, 1), r.pow - 1) / (win[1] - win[0]) : 0;
  const fast = rate > 9;
  ghosts.forEach((g, i) => { g.visible = fast; if (!fast) return; const kk = knifeAt(r, t - (i + 1) / FPS / 4); pose(g, kk.q, kk.x, kk.y, kk.z); });
}

// ---------- camera: a slow push-in while a round is cut, back to the start while the next melon slides in ----------
const PUSH = .3, PILE = new THREE.Vector3(.45, .9, .8);
function placeCamera(r, t) {
  const u = clamp((t - r.p1) / (r.p2e - r.p1));
  let z = (1 - (1 - u) * (1 - u)) * PUSH;                           // starts moving with the first cut, slows towards the end
  if (t >= r.slide) z *= 1 - easeInOut((t - r.slide) / SLIDE);
  const look = LOOK.clone().lerp(PILE, z / PUSH);                   // the aim drifts to the pile in front of the melon
  cam.position.copy(look).addScaledVector(CAM.clone().sub(LOOK), 1 - z);
  cam.lookAt(look);
}

const fmt = n => n.toLocaleString('en-US');
const roundAt = t => ROUNDS.find(q => t < q.t1) || ROUNDS[ROUNDS.length - 1];
window.renderAt = t => {
  t = Math.min(t, DURATION - 1e-6);
  const r = roundAt(t), nxt = ROUNDS[(r.i + 1) % ROUNDS.length];
  let c;
  if (t >= r.slide) {
    const u = (t - r.slide) / SLIDE;
    c = drawMelon(sets[0], r, t, -easeIn(u) * 12);
    drawMelon(sets[1], nxt, nxt.t0 - 1, (1 - easeOut(u)) * 12);
  } else { c = drawMelon(sets[0], r, t, 0); sets[1].g.visible = false; }
  placeKnife(r, t); placeCamera(r, t);
  const fresh = t >= r.slide + SLIDE * .75;   // counters reset once the old pile has mostly left the frame
  document.getElementById('cuts').textContent = fresh ? '0' : fmt(c.ka + c.kc + c.kb);
  document.getElementById('pieces').textContent = fresh ? '1' : fmt(pieceCount(r, c.ka, c.kc, c.kb));
  r3.render(scene, cam);
  return c;
};
window.kitchenReady = true;
window.ready = true;
</script></body></html>
