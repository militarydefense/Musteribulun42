function drawMelon(set, r, t, offset) {

  const hline = y => { for (const q of GRAPES) { const d = y - q.y, k2 = q.r * q.r - d * d; if (k2 > .0004 && nh < 4000) { const k = Math.sqrt(k2) * 1.006; put(set.ringsH, nh++, q.x, y, q.z, k * 1.06, lineW, k); } } };
  const nva = Math.min(r.VA - 1, Math.floor((w * ka) / wv + 1e-6));
  for (let v = 0; v < nva; v++) vline(-RX + wv * (v + 1));
  const nvc = Math.min(r.VC - 1, Math.floor((hc * kc) / hcv + 1e-6));
  for (let l = 0; l < nvc; l++) hline(2 * RY - hcv * (l + 1));
  if (kb === 0) {
    setClip(set, set.clipZ, 0, -1, RZ + 1);
    set.bracts.visible = true;
  } else {
    if (!r.cells) prepCells(r);
    const nr = kb === r.b ? r.VB : Math.min(r.VB, Math.floor(hz * kb / hv + 1e-6)), zr = RZ - hv * nr;
    setClip(set, set.clipZ, 0, -1, zr);

    if (nr < r.VB) for (const q of GRAPES) {                          // the cut face of every grape the plane goes through, with its grid
      const dz = zr - q.z, k2 = q.r * q.r - dz * dz; if (k2 <= .0004) continue;
      const k = Math.sqrt(k2);

      for (let v = 0; v < r.VA - 1; v++) { const x = -RX + wv * (v + 1), qq = 1 - ((x - q.x) / (k * 1.06)) ** 2; if (qq > 0 && ncl < 4000) put(set.capLines, ncl++, x, q.y, zr + .004, lineW * .85, 2 * k * Math.sqrt(qq) * .97, .004); }
      for (let l = 0; l < r.VC - 1; l++) { const y = 2 * RY - hcv * (l + 1), qq = 1 - ((y - q.y) / k) ** 2; if (qq > 0 && ncl < 4000) put(set.capLines, ncl++, q.x, y, zr + .004, 2 * k * 1.06 * Math.sqrt(qq) * .97, lineW * .85, .004); }
    }

      const s = (t - r.cells[j].tc) / c.dur, u = clamp(s * 1.12);

    }

  set.rings.count = nl; set.rings.instanceMatrix.needsUpdate = true;
  set.ringsH.count = nh; set.ringsH.instanceMatrix.needsUpdate = true;
  set.capLines.count = ncl; set.capLines.instanceMatrix.needsUpdate = true;
  set.cubes.forEach((im, i) => { im.count = nn[i]; im.instanceMatrix.needsUpdate = true; });
  return { ka, kc, kb };
}

// ---------- knife (same as the soap video, scaled for the bigger melon) ----------
function makeKnife(opacity) {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(3.0, 0); s.bezierCurveTo(3.8, .02, 4.3, .25, 4.7, .62);
  s.bezierCurveTo(4.0, .8, 3.1, .93, 2.1, .99); s.lineTo(0, 1.02); s.lineTo(0, 0);
  const t = opacity < 1;
  const steel = new THREE.MeshStandardMaterial({ color: 0xf0f2f5, metalness: 1, roughness: .14, envMapIntensity: 2.2, transparent: t, opacity, depthWrite: !t });
  const blade = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: .026, bevelEnabled: true, bevelThickness: .008, bevelSize: .008, bevelSegments: 1 }), steel);
  blade.position.z = -.013; blade.castShadow = !t; g.add(blade);
  const bolster = new THREE.Mesh(new RoundedBoxGeometry(.16, .64, .09, 2, .03), steel); bolster.position.set(-.06, .64, 0); g.add(bolster);
  const hm = new THREE.MeshStandardMaterial({ color: 0x6a3a1e, roughness: .55, transparent: t, opacity, depthWrite: !t });
  const handle = new THREE.Mesh(new RoundedBoxGeometry(1.95, .44, .2, 4, .09), hm); handle.position.set(-1.1, .66, 0); handle.castShadow = !t; g.add(handle);
  for (const x of [-.5, -1.1, -1.7]) { const rv = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .22, 16), steel); rv.rotation.x = Math.PI / 2; rv.position.set(x, .66, 0); g.add(rv); }
  g.scale.setScalar(1.3);
  rig.add(g); return g;
}
const knife = makeKnife(1), ghosts = [.3, .2, .13, .08].map(makeKnife);
const QA = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -Math.PI / 2, 0));
const QB = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));

const LIFT = 2 * RY + .45, REST_Y = 2 * RY + .9;
const xCut = (r, k) => -RX + 2 * RX / (r.a + 1) * k;
const yCut = (r, k) => 2 * RY - 2 * RY / (r.c + 1) * k;         // horizontal cuts go top to bottom
const zCut = (r, k) => RZ - 2 * RZ / (r.b + 1) * k;             // crosswise cuts go front to back: the falling pieces face the camera
const A_Z = -RZ - .5, B_X = RX + .55;
// horizontal: the knife lies flat, edge facing the back, handle on the right; it slides in from the front and the cut
// is done when the edge leaves the back of the melon
const QC = QB.clone().premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2));
const C_Z0 = RZ + .2, C_Z1 = -RZ - .15;
function knifeAt(r, t) {
  const qa = QA, qb = QB;
  if (t < r.p1) return { q: qa, x: xCut(r, 1), y: REST_Y, z: A_Z };
  if (t < r.p1e) {
    const x = countAt(t, r.p1, r.p1e, r.a, r.pow), k = Math.floor(x), ph = x - k;
    const from = xCut(r, Math.max(1, k)), to = xCut(r, Math.min(r.a, k + 1));
    return { q: qa, x: lerp(from, to, easeInOut((ph - .25) / .5)), y: k === 0 ? REST_Y * (1 - ph) : LIFT * Math.pow(Math.sin(Math.PI * ph), .7), z: A_Z, dir: 'a' };
  }
  if (t < r.p3) {                                                  // lift out, swing round and lie flat in front of the melon
    const u = easeInOut((t - r.p1e) / TURN), q = qa.clone().slerp(QC, u);
    return { q, x: lerp(xCut(r, r.a), B_X, u), y: lerp(0, yCut(r, 1), u) + (2 * RY + .6) * Math.sin(Math.PI * u), z: lerp(A_Z, C_Z0, u) };
  }

    const x = countAt(t, r.p3, r.p3e, r.c, r.pow), k = Math.floor(x), ph = x - k;
    const back = k === 0 ? 1 : easeInOut(ph / .35), push = easeInOut((ph - .35) / .65);

    return { q: QC, x: B_X, y, z: ph < .35 && k > 0 ? lerp(C_Z1, C_Z0, back) : lerp(C_Z0, C_Z1, push), dir: 'c' };

  }

function placeKnife(r, t) {
  const k = knifeAt(r, t);

}

// ---------- camera: a slow push-in while a round is cut, back to the start while the next melon slides in ----------
const PUSH = .3, PILE = new THREE.Vector3(.45, .6, .8);
function placeCamera(r, t) {
  const u = clamp((t - r.p1) / (r.p2e - r.p1));
  let z = (1 - (1 - u) * (1 - u)) * PUSH;                           // starts moving with the first cut, slows towards the end
  if (t >= r.slide) z *= 1 - easeInOut((t - r.slide) / SLIDE);
  const look = LOOK.clone().lerp(PILE, z / PUSH);                   // the aim drifts to the pile in front of the melon
  cam.position.copy(look).addScaledVector(CAM.clone().sub(LOOK), 1 - z);
  cam.lookAt(look);
}

const fmt = n => n.toLocaleString('en-US');
const roundAt = t => ROUNDS.find(q => t < q.t1) || ROUNDS[ROUNDS.length - 1];
window.renderAt = t => {
  t = Math.min(t, DURATION - 1e-6);
  const r = roundAt(t), nxt = ROUNDS[(r.i + 1) % ROUNDS.length];
  let c;
  if (t >= r.slide) {
    const u = (t - r.slide) / SLIDE;
    c = drawMelon(sets[0], r, t, -easeIn(u) * 12);
    drawMelon(sets[1], nxt, nxt.t0 - 1, (1 - easeOut(u)) * 12);
  } else { c = drawMelon(sets[0], r, t, 0); sets[1].g.visible = false; }
  placeKnife(r, t); placeCamera(r, t);
  const fresh = t >= r.slide + SLIDE * .75;   // counters reset once the old pile has mostly left the frame
  document.getElementById('cuts').textContent = fresh ? '0' : fmt(c.ka + c.kc + c.kb);
  document.getElementById('pieces').textContent = fresh ? fmt(GRAPES.length) : fmt(pieceCount(r, c.ka, c.kc, c.kb));
  r3.render(scene, cam);
  return c;
};
window.kitchenReady = true;
window.ready = true;
