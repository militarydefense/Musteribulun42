<script type="module">

  const big = r.n >= 40, power = { 13: 1.1, 25: 1.35, 40: 1.7, 100: 2.3 }[r.n];
  r.cubes = [];
  for (let i = 0; i <= ax; i++) for (let j = 0; j <= ay; j++) for (let k = 0; k <= az; k++) {
    const x0 = -R + wx * i, y0 = -R + wy * j, z0 = -R + wz * k, x1 = x0 + wx, y1 = y0 + wy, z1 = z0 + wz;
    const dx = near(x0, x1, 0) / R, dy = near(y0, y1, 0) / R, dz = near(z0, z1, 0) / R;
    if (dx * dx + dy * dy + dz * dz >= 1) continue;
    const ex = R * Math.sqrt(1 - dy * dy - dz * dz), ey = R * Math.sqrt(1 - dx * dx - dz * dz), ez = R * Math.sqrt(1 - dx * dx - dy * dy);
    const a0 = Math.max(x0, -ex), a1 = Math.min(x1, ex), b0 = Math.max(y0, -ey), b1 = Math.min(y1, ey), c0 = Math.max(z0, -ez), c1 = Math.min(z1, ez);
    const sx = Math.max(.012, a1 - a0), sy = Math.max(.012, b1 - b0), sz = Math.max(.012, c1 - c0);
    const lx = 1 - sx / wx, ly = 1 - sy / wy, lz = 1 - sz / wz, lm = Math.max(lx, ly, lz);
    const kind = lm < .08 ? 0 : lm === lx ? 1 : lm === ly ? 2 : 3;
    const c = new THREE.Vector3((a0 + a1) / 2, (b0 + b1) / 2, (c0 + c1) / 2);
    const h1 = hash(i, j, k + r.n), h2 = hash(j + 7, k, i + r.n), h3 = hash(k + 3, i, j + 5 * r.n);
    // outward burst: mostly sideways, a little forward toward the camera; bonus pieces partly fly past the camera
    const dir = new THREE.Vector3(c.x, Math.max(0, c.y) * .5 + .15, c.z + .35 * R).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), (h2 - .5) * 1.1);
    const sp = power * (.55 + .7 * h1) * (.6 + .6 * (c.length() / R));
    let pf = new THREE.Vector3(c.x + dir.x * sp, 0, c.z + dir.z * sp * 1.1);

    if (r.n === 100 && h3 < .22) { pf.set((h1 - .5) * 9, 0, 6 + 8 * h2); peak = 2.4 + 2.5 * h1; dur = .8 + .5 * h2; }   // toward and past the camera
    const smin = Math.min(sx, sy, sz);
    const qf = new THREE.Quaternion().setFromEuler(new THREE.Euler(h1 * 6.28, h2 * 6.28, h3 * 6.28));

}
function drawCubes(r, t) {
  const cubes = cubesOf(r), u0 = t - r.hit, nn = [0, 0, 0, 0];
  for (const cb of cubes) {
    const u = clamp((u0 - cb.delay) / cb.dur);
    const gy = ground(cb.pf.x, cb.pf.z) + cb.rest;
    P.set(lerp(cb.c.x, cb.pf.x, u), lerp(R + cb.c.y, gy, u * u) + cb.peak * 4 * u * (1 - u), lerp(cb.c.z, cb.pf.z, u));
    Q.copy(QI).slerp(cb.qf, u); S.set(cb.sx, cb.sy, cb.sz); M.compose(P, Q, S);
    const im = cubeSets[cb.kind]; if (nn[cb.kind] < CUBES) im.setMatrixAt(nn[cb.kind]++, M);
  }
  cubeSets.forEach((im, i) => { im.count = nn[i]; im.instanceMatrix.needsUpdate = true; });
}
function hideCubes() { cubeSets.forEach(im => im.count = 0); }

// ---------- loose seeds that fly out on impact ----------
const SEEDS = 2600;
const seedMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(.032, 12, 10), new THREE.MeshPhysicalMaterial({ color: 0xb3081f, roughness: .12, clearcoat: 1, transmission: .25, thickness: .2 }), SEEDS);
seedMesh.castShadow = true; seedMesh.frustumCulled = false; seedMesh.count = 0; scene.add(seedMesh);
function drawSeeds(r, t) {
  const n = Math.min(SEEDS, { 1: 40, 3: 90, 7: 160, 13: 260, 25: 420, 40: 650, 100: 2600 }[r.n]), u0 = t - r.hit;
  let k = 0;
  for (let i = 0; i < n; i++) {
    const h1 = hash(i, r.n, 1), h2 = hash(i, r.n, 2), h3 = hash(i, r.n, 3), a = h1 * 6.283;
    const sp = (1.2 + 3.2 * h2) * (r.n >= 40 ? 1.5 : 1), far = r.n === 100 && h3 < .25;
    const pf = far ? new THREE.Vector3((h1 - .5) * 8, 0, 5 + 8 * h2) : new THREE.Vector3(Math.cos(a) * (R * .6 + sp), 0, Math.sin(a) * (R * .6 + sp) + .4);
    const dur = (far ? .9 : .45) + .4 * h3, u = clamp((u0 - .02 * h3) / dur);
    const y = lerp(R + (h3 - .5) * R, ground(pf.x, pf.z) + .04, u * u) + (far ? 3 : .5 + 1.2 * h1) * 4 * u * (1 - u);
    P.set(lerp(Math.cos(a) * R * .5, pf.x, u), y, lerp(Math.sin(a) * R * .5, pf.z, u));
    Q.setFromAxisAngle(Z, h2 * 3); S.set(1, .8 + .3 * h3, .8); M.compose(P, Q, S); seedMesh.setMatrixAt(k++, M);
  }
  seedMesh.count = k; seedMesh.instanceMatrix.needsUpdate = true;
}

// ---------- camera: a slow push-in during every round; the hook is a close-up ----------
const CAM0 = new THREE.Vector3(0, 9.0, 13.0), LOOK0 = new THREE.Vector3(0, 1.2, 0);
function placeCamera(t, r) {
  if (!r) { const u = t / HOOK; cam.position.set(Math.sin(u * .5) * .5, 5.4, 8.6 - .6 * u); cam.lookAt(0, FLOAT_Y + .15, 0); return; }
  const u = clamp((t - r.t0) / (r.t1 - r.t0)), z = (1 - (1 - u) * (1 - u)) * .13;
  cam.position.copy(LOOK0).addScaledVector(CAM0.clone().sub(LOOK0), 1 - z); cam.lookAt(LOOK0);
}

const el = id => document.getElementById(id);
window.renderAt = t => {
  t = Math.min(t, DURATION - 1e-6);
  const r = t < HOOK ? null : ROUNDS.find(q => t < q.t1) || ROUNDS[ROUNDS.length - 1];
  ROUNDS.forEach(q => { if (q !== r) hideCells(q); });
  hideCubes(); seedMesh.count = 0; streaks.count = 0;
  el('hook').style.display = r ? 'none' : 'block';
  el('label').style.display = r && !r.bonus ? 'block' : 'none';
  el('bonus').style.display = r && r.bonus ? 'block' : 'none';
  el('end').style.display = r && r.bonus && t > r.t1 - END ? 'block' : 'none';
  if (r) el('label').textContent = r.n === 1 ? '1 Cut' : `${r.n} Cuts`;
  if (!r) {                                                         // hook: the 40-cut fruit, all lines drawn, close up
    fruit.visible = true; fruit.position.set(0, FLOAT_Y + .04 * Math.sin(t * 3), 0); fruit.rotation.y = t * .25;
    drawLines(ROUNDS[5].planes, 999);
  } else if (t < r.hit) {                                           // floating, strokes, drop
    fruit.visible = true; fruit.rotation.y = 0;
    const fy = t < r.drop ? FLOAT_Y + .04 * Math.sin((t - r.t0) * 3) : lerp(FLOAT_Y, R, Math.pow((t - r.drop) / (r.hit - r.drop), 2));
    fruit.position.set(0, fy, 0);
    const k = strokesDone(r, t); drawLines(r.planes, k);
    // streaks of the strokes that happened in the last 0.08 s
    let ns = 0;
    for (let i = Math.max(0, k - 24); i < k; i++) {
      const ts = strokeAt(r, i + 1), age = (t - ts) / .08; if (age < 0 || age > 1) continue;
      const p = r.planes[i];
      const up = Math.abs(p.n.y) > .9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const along = new THREE.Vector3().crossVectors(p.n, up).normalize(), dn = new THREE.Vector3().crossVectors(along, p.n).normalize();
      const base = p.n.clone().multiplyScalar(p.d).addScaledVector(dn, lerp(2.2, -2.2, age) * R * .6);
      M.makeBasis(along.clone().multiplyScalar(3.4 * R), dn.clone().multiplyScalar(.55 * R), p.n.clone()); M.setPosition(base.x, base.y + fy, base.z);
      streaks.setMatrixAt(ns++, M);
    }
    streaks.count = ns; streaks.instanceMatrix.needsUpdate = true;
  } else {                                                          // burst
    fruit.visible = false;
    if (r.n <= 7) drawCells(r, t); else drawCubes(r, t);
    drawSeeds(r, t);
  }
  placeCamera(t, r);
  r3.render(scene, cam);
};
window.ready = true;
</script></body></html>
