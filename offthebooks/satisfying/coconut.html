// ---------- knife (same as the soap video, scaled for the bigger melon) ----------
function makeKnife(opacity) {

  s.bezierCurveTo(4.0, .8, 3.1, .93, 2.1, .99); s.lineTo(0, 1.02); s.lineTo(0, 0);
