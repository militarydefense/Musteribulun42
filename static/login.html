<html lang="tr">
<head>

<body class="login-body">
<form class="login-card" method="post" action="/login">
  <img src="/static/icon-192.png" alt="" width="72" height="72">
  <h1>Küresel Müşteri Bulucu</h1>
  <p class="muted">Av &amp; Spor Silahları · GTİP 9303</p>
  <p id="err" class="login-err" hidden>Şifre hatalı. Tekrar deneyin.</p>
  <label for="pw">Panel şifresi</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button class="primary big" type="submit">Giriş yap</button>
</form>
<script>if (location.search.includes("hata")) document.getElementById("err").hidden = false;</script>
</body>
